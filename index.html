/* 仅更新顶栏通知角标（性能：代替 renderShell 全量重建） */
function refreshBadge(){
  const u = Session.user(); if(!u) return;
  const n = Store.unreadCount(u);
  $$('.menu a[data-r="notices"]').forEach(a=>{
    const ex = a.querySelector('.badge');
    if(n > 0){ if(ex){ ex.textContent = n; } else { const b = mk('span'); b.className='badge'; b.textContent=n; a.appendChild(b); } }
    else if(ex) ex.remove();
  });
}
function videoCard(v, u){
  const st = v.steps.map((s,i)=>{
    const cls = s.status==='已通过'?'done':s.status==='已驳回'?'rej':(i===v.step&&v.status==='审批中'?'cur':'');
    return `<div class="step ${cls}"><div class="dot">${s.status==='已通过'?'✓':s.status==='已驳回'?'✕':i+1}</div>${s.label}${s.by?'·'+U.esc(s.by):''}</div>${i<v.steps.length-1?'<span class="muted">—</span>':''}`;
  }).join('');
  const can = Store.videoCanApprove(v, u);
  return `<div class="nitem"><div class="nt">🎬 视频申请文书 · ${U.esc(v.title)}</div>
    <div class="nb">申请人：${U.esc(v.applicant)}　简介：${U.esc(v.brief||'-')}</div>
    <div class="nb" style="color:var(--txt3)">文书内容：${U.esc((v.content||'').slice(0,120))}${(v.content||'').length>120?'…':''}</div>
    <div class="steps">${st}</div>
    ${can?`<div class="nm2"><span>${U.esc(can.label)} 环节审批</span>
      <button class="btn sm pri" data-vok="${v.id}">通过</button>
      <button class="btn sm danger" data-vno="${v.id}">驳回</button></div>`:''}
    <div class="nm2"><span>${U.fmtTs(v.ts)}</span><span class="tag ${v.status==='已通过'?'green':v.status==='已驳回'?'red':'orange'}">${v.status}</span></div>
  </div>`;
}
function bindVideoBtns(u){
  $$('[data-vok]').forEach(b=>b.onclick=async()=>{
    const c = prompt('审批备注（可空）：')||'';
    await Store.decideVideo(u, b.dataset.vok, true, c); U.toast('已通过'); Router.go('notices'); });
  $$('[data-vno]').forEach(b=>b.onclick=async()=>{
    const c = prompt('驳回理由：')||'';
    await Store.decideVideo(u, b.dataset.vno, false, c); U.toast('已驳回'); Router.go('notices'); });
}

/* --- 行为日志（增强：操作人/结果筛选 + CSV 导出） --- */
function adminLog(el){
  const logs = (Store.logs.items||[]).slice().sort((a,b)=>b.ts-a.ts);
  const usersList = [...new Set(logs.map(l=>l.name).filter(Boolean))];
  el.innerHTML = `
  <div class="card">
    <h3>全社行为日志（${logs.length} 条） <span class="muted" style="font-weight:400;font-size:12px;margin-left:auto">最近 900 条滚动保留</span></h3>
    <div class="row wrap" style="margin-bottom:10px">
      <input id="lg_q" placeholder="按账号/行为/对象筛选…" style="max-width:260px">
      <select id="lg_u" style="max-width:130px"><option value="">全部人员</option>
        ${usersList.map(n=>`<option>${U.esc(n)}</option>`).join('')}</select>
      <select id="lg_r" style="max-width:120px"><option value="">全部结果</option><option>成功</option><option>失败</option><option>待审批</option></select>
      <button class="btn sm" id="lg_csv">⬇ 导出 CSV</button>
    </div>
    <div id="lg_list" style="max-height:60vh;overflow-y:auto"></div>
  </div>`;
  const render = () => {
    const q = ($('#lg_q').value||'').trim();
    const un = $('#lg_u').value;
    const rr = $('#lg_r').value;
    const list = logs.filter(l => (!q || (l.user+l.name+l.action+l.target+l.detail).includes(q)) &&
      (!un || l.name===un) && (!rr || l.result===rr));
    $('#lg_list').innerHTML = list.map(l=>`
      <div class="logline">[${U.fmtTs(l.ts)}] <b>${U.esc(l.name)}</b>（${U.esc(l.user)}）
        ${U.esc(l.action)} · <b>${U.esc(l.target)}</b> ${U.esc(l.detail)}
        <span class="${l.result==='成功'||l.result==='已记录'?'ok':l.result==='失败'?'no':'muted'}">${U.esc(l.result)}</span></div>`).join('')
      || '<div class="empty">无匹配记录</div>';
  };
  $('#lg_q').oninput = U.debounce(render, 250);
  $('#lg_u').onchange = render;
  $('#lg_r').onchange = render;
  $('#lg_csv').onclick = () => {
    const rows = [['时间','账号','姓名','行为','对象','详情','结果']];
    for(const l of logs) rows.push([U.fmtTs(l.ts), l.user, l.name, l.action, l.target, l.detail, l.result]);
    const csv = '\ufeff' + rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const d = new Date(); const p=n=>String(n).padStart(2,'0');
    U.dl(`行为日志_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.csv`, new Blob([csv], {type:'text/csv;charset=utf-8'}));
    U.toast('日志已导出');
  };
  render();
}

/* ---------- 密码保险库（社长专属 · FZENC AES-256 加密存储） ---------- */
function vaultStoreDlg(username, displayName, pwd, note){
  return new Promise((res, rej) => {
    if(!Store.vaultEnabled()){ rej(new Error('请先在密码保险库中初始化')); return; }
    const m = Modal.open(`<h3>存入密码保险库 → ${U.esc(username)}</h3>
      <div class="muted" style="line-height:1.8">输入保险库密码，将「${U.esc(displayName)}（${U.esc(username)}）」的当前密码加密存档。</div>
      <label class="fl">保险库密码</label><input id="vs_p" type="password">
      <div class="foot"><button class="btn" id="vs_c">取消</button><button class="btn pri" id="vs_o">存入</button></div>`, {sticky:true});
    m.querySelector('#vs_c').onclick=()=>{ m.remove(); rej(new Error('已取消')); };
    m.querySelector('#vs_o').onclick = async () => {
      try {
        await Store.vaultAdd(Session.user(), m.querySelector('#vs_p').value, {username, displayName, pwd, note:note||'', ts:Date.now()});
        U.toast('已存入密码保险库'); m.remove(); res();
      } catch(e){ m.querySelector('#vs_o').disabled = false; rej(e); }
    };
  });
}

  };

      try {
        const list = await Store.vaultOpen(Session.user(), m.querySelector('#vb_p').value);
        m.querySelector('#vb_s').innerHTML = '<span class="ok">已解锁</span>';
        renderList(list);
      } catch(e){ m.querySelector('#vb_s').textContent = '解锁失败：' + (e.message||e); }
    };

      const t = Store.users.items.filter(x=>!x.deleted);

        <label class="fl">账号</label><select id="va_u">${t.map(x=>`<option value="${U.esc(x.username)}" data-n="${U.esc(x.displayName)}">${U.esc(x.displayName)}（${U.esc(x.username)}）</option>`).join('')}</select>

      m2.querySelector('#va_c').onclick=()=>m2.remove();
      m2.querySelector('#va_o').onclick = async () => {
        try {
          await Store.vaultAdd(Session.user(), m.querySelector('#vb_p').value,
            {username:m2.querySelector('#va_u').value, displayName:m2.querySelector('#va_u').selectedOptions[0].dataset.n,
             pwd:m2.querySelector('#va_p').value, note:m2.querySelector('#va_n').value.trim(), ts:Date.now()});
          U.toast('已存入'); m2.remove();
          const list = await Store.vaultOpen(Session.user(), m.querySelector('#vb_p').value);
          renderList(list);
        } catch(e){ U.toast('存入失败：'+(e.message||e),1); }
      };
    };
  } else {
    m.querySelector('#vb_i').onclick = async () => {
      const p1 = m.querySelector('#vb_p1').value, p2 = m.querySelector('#vb_p2').value;
      if(p1 !== p2){ U.toast('两次密码不一致',1); return; }
      try {
        await Store.vaultInit(Session.user(), p1);
        U.toast('保险库已初始化'); m.remove(); vaultDlg();
      } catch(e){ m.querySelector('#vb_s').textContent = e.message||String(e); }
    };
  }
}

  });

      <input type="checkbox" id="dc_rec" checked style="width:auto"> 记录本次行为</label>
    <label style="display:flex;gap:8px;align-items:center;margin-top:6px;font-size:13px">
      <input type="checkbox" id="dc_files" checked style="width:auto">
      同步生成 Word / PDF 文件版并归档（推荐 · 与文书同批号）</label>
    <div style="margin-top:12px"><button class="btn pri" id="dc_o">生成并归档</button></div>
    <div id="dc_out" style="margin-top:16px"></div>
  </div>`;
  $('#dc_o').onclick = async () => {
    const title = $('#dc_ti').value.trim();
    const body = $('#dc_b').value.trim();
    if(!title||!body){ U.toast('请填写标题与正文',1); return; }
    try {
      U.toast('生成并加密归档中…');
      const {text, no} = await Store.genDoc(Session.user(), {
        kind:$('#dc_k').value, to:$('#dc_t').value.trim(), title, body,
        aboutIds:Array.from($('#dc_a').selectedOptions).map(o=>o.value),
        folderId:$('#dc_f').value, record:$('#dc_rec').checked
      });
      U.toast('文书已归档：'+no);
      let fileStat = '';
      let pack = null;
      if($('#dc_files').checked){
        try {
          const accounts = Array.from($('#dc_a').selectedOptions).map(o=>o.value).map(id=>{
            const x = Store.users.items.find(y=>y.id===id); return x ? x.displayName+'（'+(x.gradeClass||'')+'）' : '';
          }).filter(Boolean);
          const bodyReplaced = body.replace(/【相关账号】/g, accounts.join('、'));
          pack = await Office.docPack({title, batchNo:no, to:$('#dc_t').value.trim(), bodyText:bodyReplaced});
          const base = `${no} ${title}`;
          Office.downloadPack(pack, base);
          const folder = Store.cfg.folders.find(f=>f.id===$('#dc_f').value);
          if(folder) await Office.archivePack(Session.user(), pack, folder, base, {
            batchNo:no, level:'核心级', desc:'自动生成文书文件版', tags:['文书', $('#dc_k').value]});
          fileStat = '<span class="ok">Word / PDF 文件版已生成' + (folder?'并归档':'') + '</span>';
        } catch(err){ fileStat = `<span class="no" style="color:var(--red)">Word/PDF 生成失败：${U.esc(err.message||err)}</span>`; }
      }
      $('#dc_out').innerHTML = `<div class="docview" id="dc_v" style="white-space:pre-wrap">${U.esc(text)}</div>
        <div class="row" style="margin-top:10px"><button class="btn" id="dc_dl">下载文书 .txt</button>
        ${pack?'<button class="btn" id="dc_dlw">下载 Word</button><button class="btn" id="dc_dlp">下载 PDF</button>':''}
        <button class="btn" id="dc_cp">复制全文</button></div>
        <div class="muted" style="margin-top:6px">${fileStat}</div>`;
      $('#dc_dl').onclick = ()=>U.dl(title+'.txt', new Blob([text], {type:'text/plain;charset=utf-8'}));
      if(pack){
        const base = `${no} ${title}`;
        $('#dc_dlw').onclick = ()=>U.dl(base+'.docx', new Blob([pack.docx], {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}));
        $('#dc_dlp').onclick = ()=>U.dl(base+'.pdf', new Blob([pack.pdf], {type:'application/pdf'}));
      }
      $('#dc_cp').onclick = ()=>U.copy(text);
    } catch(e){ U.toast('生成失败：'+(e.message||e),1); }
  };
}

/* --- 系统设置（含令牌管理：自动解决 + 手动解决入口） --- */

  const poolN = (c.sysTokens||[]).length;

  el.innerHTML = `

  </div>
  <div class="card"><h3>数据安全状态</h3>

    <div class="kv"><span class="k">自动备份</span>${ab.ts?`上次 ${U.fmtTs(ab.ts)}（${U.esc(ab.by||'-')}）· 7 天周期`:'尚未执行（社长/处长登录时自动触发）'}</div>
    <div class="kv"><span class="k">待同步</span>${dirty.length?`<span class="tag orange">${dirty.length} 个文件待冲刷（每 45 秒自动重试）</span>`:'<span class="tag green">全部已同步网盘</span>'}</div>
    <div class="muted" style="margin-top:8px;line-height:1.9">快照仅存于当前浏览器；更换设备后以网盘数据为准。详细健康检查见「数据与回收站」。</div>
  </div>
  <div class="card"><h3>系统令牌（网盘连接）· 自动解决与手动解决</h3>
    <div class="kv"><span class="k">当前令牌</span>${exp>Date.now()?`<span class="tag green">有效，剩余 ${U.fmtDur(exp-Date.now())}</span>`:'<span class="tag red">已失效</span>'}</div>
    <div class="kv"><span class="k">引导令牌</span>${bootExp>Date.now()?`<span class="tag ${bootExp-Date.now()<48*3600*1000?'orange':'green'}">至 ${U.fmtTs(bootExp)}（剩余 ${U.fmtDur(bootExp-Date.now())}）</span>`:'<span class="tag red">已过期，需手动恢复链条</span>'}</div>
    <div class="kv"><span class="k">令牌冗余池</span>${poolN} 个历史令牌（续期时自动逐一尝试，提高链条韧性）</div>
    <div class="kv"><span class="k">自动防线</span><span>每次打开自动续期并回存 · 页面打开期间每 12 小时保活 · 写入失败 45 秒周期自动冲刷</span></div>
    ${bootExp&&bootExp-Date.now()<48*3600*1000&&bootExp>Date.now()?`<div class="dbar">引导令牌将于 ${U.fmtDur(bootExp-Date.now())} 后到期：请提醒任一社员在此之前打开一次系统，即可自动续链。</div>`:''}
    <div class="row wrap" style="margin-top:12px">
      <button class="btn pri" id="sy_renew">立即续期</button>
      <button class="btn" id="sy_rc">打开令牌修复中心</button>
    </div>
    <div class="muted" id="sy_tks" style="margin-top:8px"></div>

      无需任何人工操作；若引导令牌也过期（长时间无人打开系统），需在修复中心手动粘贴一次游客令牌恢复链条。</div>

      return `<span class="tag" style="margin:0 8px 8px 0">${k}（${v}）：第 ${String(n).padStart(3,'0')} 号 · 下一号 ${Store.peekBatchNo(k)}</span>`;}).join('')}</div>

    U.toast('已保存'); 
  };
  $('#sy_renew').onclick = async () => {
    const btn = $('#sy_renew'); btn.disabled = true;
    $('#sy_tks').textContent = '续期中…';
    try {
      await YST.renew();
      rememberTokens();
      $('#sy_tks').innerHTML = `<span class="ok">续期成功，新令牌有效至 ${U.fmtTs(YST.tkExp())}</span>，正在刷新…`;
      setTimeout(()=>nav2('admin/sys'), 1200);
    } catch(e){ $('#sy_tks').textContent = '续期失败：' + (e.message||e); }
    btn.disabled = false;
  };
  $('#sy_rc').onclick = () => showRecoveryDlg();
  $('#sy_clr').onclick = async () => {
    if(await Modal.confirm('清空积分台账','确定清空本学期全部积分记录？此操作不可撤销且将记录日志。','清空')){
      await Store.upd('points', P => { P.ledger = []; });
      await Store.log(Session.user(), '积分清零', '积分台账', '学期末清空', '成功');
      U.toast('已清空'); nav2('admin/sys');

/* ---------- 启动（并行加载 + 智能续期 + 令牌池冗余 + 保活 + 降级模式） ---------- */
let booted = false;
/* 令牌池回存：新令牌写入 config.sysToken 并滑窗保留 8 个历史（续期韧性） */
let _rememberT = null;
function rememberTokens(){
  const t = YST.tk; if(!t) return;
  clearTimeout(_rememberT);
  _rememberT = setTimeout(() => {
    Store.upd('config', C => {
      if(C.sysToken !== t){
        C.sysToken = t; C.sysTokenTs = Date.now();
        C.sysTokens = [t, ...(C.sysTokens||[])].filter((x,i,a)=>a.indexOf(x)===i).slice(0, 8);
      }
    }).catch(()=>{});
  }, 400);
}
/* 令牌保活：页面打开期间每 12 小时强制续期一次，保持链条常新 */
function startTokenKeepalive(){
  if(window.__kaTimer) return;
  window.__kaTimer = setInterval(() => {
    if(!Session.user()) return;
    YST.boot(true).then(()=>rememberTokens()).catch(()=>{});
  }, 12*3600*1000);
}
/* 认证致命失败：自动弹出令牌修复中心（10 分钟节流在 YST 内部） */
YST.onAuthFail(() => {
  U.toast('网盘连接异常：已打开令牌修复中心', 1);
  Modal.closeAll();
  showRecoveryDlg();
});
/* ---------- 引擎自愈信号（更新必达机制） ----------
 * SVG 宿主（网盘引擎）启动时把自身 URL 写入 config.engineUrl ——
 * config 里永远是「最近一次有人打开系统所用的引擎地址」，启动器据此自动追新。
 * （旧版的顶部「新版本通知」黄条已按用户要求移除：更新由启动器无感切换，不再弹条打扰） */
function syncEngineSignal(){
  try{
    const C = Store.cfg || {};
    const onYsepan = /ysepan\.com/i.test(location.href);
    const isSvgHost = IS_SVG_DOC && onYsepan && /\.svg(\?|$)/i.test(location.pathname + location.search);
    if(isSvgHost && location.href !== C.engineUrl){
      Store.upd('config', X => { X.engineUrl = location.href; X.engineTs = Date.now(); }).catch(()=>{});
    }
  }catch(e){}
}
async function bootApp(skipBoot){
  Theme.init();
  try {
    if(!Store.cfg){
      Store.init(window.WEBTEMP_BH);
      const sessHint = (()=>{ try{ return JSON.parse(localStorage.getItem('fzsy_session')||'null'); }catch(e){ return null; } })();
      // 秒开提速：数据装载（网盘最新版 → 本机快照 → 默认结构）后台并行，登录页先行渲染；
      // 已有会话时等待装载完成再进主界面（保证数据完整）
      window.__STORE_READY = (async () => {
        try { await Store.loadAll(); }
        catch(e){
          console.warn('网盘加载失败，降级本机快照:', e.message||e);
          try { Store.loadAllFallback(); window.__DEGRADED = true; } catch(_2){}
        }
        // 令牌冗余池注入（config.sysToken + config.sysTokens 历史池）
        (Store.cfg.sysTokens||[]).forEach(t=>YST.addExtra(t));
        if(Store.cfg.sysToken) YST.addExtra(Store.cfg.sysToken);
        // 智能续期：令牌仍有效超 24h 则跳过（jwtPay 修复后真正生效）；后台执行不阻塞启动
        YST.boot().then(() => rememberTokens()).catch(()=>{});
        Store.startFlushTimer();       // 数据不丢失：脏文件周期/卸载冲刷
        startTokenKeepalive();         // 令牌保活
        try { syncEngineSignal(); } catch(_2){}
        return true;
      })();
      if(!sessHint || !sessHint.id){
        viewLogin();                   // 秒开登录页（数据装载并行，点击登录时自动等待就绪）
        await window.__STORE_READY;
        return;
      }
      await window.__STORE_READY;
    }
    const restored = await Session.restore();
    if(!restored){ viewLogin(); return; }
    renderShell();
    syncEngineSignal();              // 更新必达：引擎自愈信号（登录后写入，避免被登录页重写）
    const path = (location.hash||'').replace(/^#\//,'') || 'home';
    const seg = path.split('/');
    Router.go(seg[0], ...seg.slice(1));
    // 静默周期备份（仅社长/处长；距上次超 7 天才真正执行）
    Store.maybeAutoBackup(Session.user()).catch(()=>{});
  } catch(e){
    // 降级模式：网盘全断（令牌链条失效/网络故障）时用本机快照启动，可登录浏览与操作，
    // 操作数据保留在本机快照，令牌恢复后自动冲刷回网盘 —— 确保数据不丢失
    try {
      if(!Store.cfg){
        Store.init(window.WEBTEMP_BH);
        Store.loadAllFallback();
        (Store.cfg.sysTokens||[]).forEach(t=>YST.addExtra(t));
        if(Store.cfg.sysToken) YST.addExtra(Store.cfg.sysToken);
        Store.startFlushTimer();
        window.__DEGRADED = true;
      }
      const restored = await Session.restore();
      if(restored){
        renderShell();
        syncEngineSignal();
        const path = (location.hash||'').replace(/^#\//,'') || 'home';
        const seg = path.split('/');
        Router.go(seg[0], ...seg.slice(1));
        U.toast('网盘连接异常：已进入离线模式，可打开「令牌修复中心」恢复', 1);
        showRecoveryDlg();
        return;
      }
      viewLogin();   // 本机快照可用：进入登录页（含离线提示），社长登录后可修复令牌
      setTimeout(showRecoveryDlg, 600);
      return;
    } catch(e2){}
    $('#app').innerHTML = `<div class="login-wrap"><div class="login-hero">
      <div class="bgimg"></div><div class="bmask"></div>
      <div class="login-box" style="position:relative;z-index:1">
      <h1>系统初始化失败</h1>
      <div class="muted" style="margin:14px 0;line-height:1.9">${U.esc(e.message||e)}</div>
      <button class="btn pri" style="width:100%;justify-content:center;margin-bottom:10px" onclick="location.reload()">重试</button>
      <button class="btn" style="width:100%;justify-content:center" id="boot_rc">令牌修复中心</button>
    </div></div></div>`;
    const brc = $('#boot_rc');
    if(brc) brc.onclick = showRecoveryDlg;
  }
}
window.addEventListener('hashchange', () => {
  if(!Session.user()) return;
  const path = (location.hash||'').replace(/^#\//,'') || 'home';
  const seg = path.split('/');
  Router.go(seg[0], ...seg.slice(1));
});
__LAUNCH();

</script>
