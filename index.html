/* ============================================================
   社团文档归档权限系统 · Fluid 主题复刻版
   与 beixianggumao.github.io (Hexo Fluid) 同源设计：
   深蓝导航 #2f4154 / 亮暗双模式 / 白色看板 / 打字机横幅 / 进度条
   所有样式作用于 #app（兼容 SVG 宿主）
   ============================================================ */
* { margin:0; padding:0; box-sizing:border-box; }
#app {
  /* ---- Fluid 亮色变量 ---- */
  --body-bg:#eee; --board:#fff; --panel:#f8f9fa;
  --txt:#2c3e50; --txt2:#3c4858; --txt3:#718096;
  --heading:#1a202c; --line:#eaecef; --inputline:#d8dee4;
  --link:#0366d6; --linkhover:#30a9de;
  --navbg:#2f4154; --navtxt:#fff;
  --pri:#2f4154; --prihover:#3d5673;
  /* ---- 旧变量映射（视图层内联样式兼容） ---- */
  --bg:var(--body-bg); --bg2:var(--board); --bg3:#f2f3f5;
  --gold:var(--link); --gold2:var(--link); --golddim:rgba(3,102,214,.09);
  --red:#c74634; --green:#2f9e5f; --blue:#0366d6; --orange:#c07d10;
  --fs:14px;
  min-height:100vh; background:var(--body-bg); color:var(--txt);
  font-size:var(--fs); line-height:1.7;
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
}
#app[data-mode="dark"] {
  --body-bg:#181c27; --board:#252d38; --panel:#2b3442;
  --txt:#c4c6c9; --txt2:#c4c6c9; --txt3:#a7a9ad;
  --heading:#e2e4e8; --line:#435266; --inputline:#4a5a70;
  --link:#1589e9; --linkhover:#30a9de;
  --navbg:#1f3144; --navtxt:#d0d0d0;
  --pri:#46647e; --prihover:#56789a;
  --bg:var(--body-bg); --bg2:var(--board); --bg3:#364151;
  --gold:var(--link); --gold2:var(--link); --golddim:rgba(21,137,233,.13);
  --red:#e2726a; --green:#57c583; --blue:#1589e9; --orange:#e0a03c;
}
#app a { color:var(--link); text-decoration:none; cursor:pointer; }
#app a:hover { color:var(--linkhover); }
#app h1,#app h2,#app h3 { font-weight:600; color:var(--heading); }
::-webkit-scrollbar { width:8px; height:8px; }
#app ::-webkit-scrollbar-thumb { background:var(--scrollbar,#c4c6c9); border-radius:4px; }
#app ::-webkit-scrollbar-track { background:transparent; }
.container { max-width:1150px; margin:0 auto; padding:0 14px; }

/* ---------- 顶部进度条（Fluid progressbar） ---------- */
#app .pbar { position:fixed; top:0; left:0; height:3px; width:0; background:#29d; z-index:1300; transition:width .1s linear; box-shadow:0 0 6px rgba(41,141,255,.6); }

/* ---------- 顶部导航（scrolling-navbar） ---------- */
#app .topnav { position:fixed; top:0; left:0; right:0; z-index:1200; background:transparent;
  transition:background .35s ease, box-shadow .35s ease; font-size:.875rem; }
#app .topnav.scrolled { background:var(--navbg); box-shadow:0 2px 5px 0 rgba(0,0,0,.16), 0 2px 10px 0 rgba(0,0,0,.12); }
#app .topnav.alwayssolid { background:var(--navbg); }
#app .navin { display:flex; align-items:center; height:56px; gap:6px; }
#app .brand { color:#fff; font-size:16px; white-space:nowrap; letter-spacing:.5px; cursor:pointer; }
#app .brand b { font-weight:700; }
#app .brand small { opacity:.75; font-weight:400; font-size:12px; margin-left:2px; }
#app .menu { display:flex; align-items:center; gap:2px; margin-left:auto; flex-wrap:nowrap; }
#app .menu > a, #app .menu > span.mchip {
  display:flex; align-items:center; gap:5px; color:rgba(255,255,255,.88); padding:8px 11px;
  border-radius:4px; font-size:13.5px; white-space:nowrap; cursor:pointer; transition:.18s; }
#app .menu > a:hover { color:#fff; background:rgba(255,255,255,.12); }
#app .menu > a.on { color:#fff; background:rgba(255,255,255,.18); }
#app .menu .badge { background:#e05252; color:#fff; font-size:10px; border-radius:9px; padding:0 5px; line-height:16px; margin-left:2px; }
#app .mchip .ava { width:26px; height:26px; border:2px solid rgba(255,255,255,.5); font-size:12px; }
#app .mchip .mname { max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#app .hamb { display:none; margin-left:auto; background:none; border:none; cursor:pointer; padding:10px; }
#app .hamb span { display:block; width:20px; height:2px; background:#fff; margin:4px 0; border-radius:2px; transition:.25s; }
#app .hamb.open span:nth-child(1) { transform:translateY(6px) rotate(45deg); }
#app .hamb.open span:nth-child(2) { opacity:0; }
#app .hamb.open span:nth-child(3) { transform:translateY(-6px) rotate(-45deg); }

/* ---------- 横幅 Banner（打字机 + 遮罩） ---------- */
#app .banner { position:relative; overflow:hidden; background:var(--navbg); }
#app .banner .bgimg { position:absolute; inset:0;
  background-image:var(--banner-img), linear-gradient(160deg,#22334a 0%,#2f4154 55%,#3d5673 100%);
  background-size:cover; background-position:center; }
#app .banner.hero { height:46vh; min-height:330px; }
#app .banner.slim { height:26vh; min-height:210px; }
#app .banner .full-bg-img { position:absolute; inset:0; }
#app .banner .bmask { position:absolute; inset:0; background:rgba(0,0,0,.3); }
#app .banner .banner-text { position:relative; z-index:2; height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:0 20px; }
#app .banner .h2 { color:#fff; font-size:2rem; font-weight:700; letter-spacing:2px;
  text-shadow:0 2px 14px rgba(0,0,0,.45); line-height:1.5; }
#app .banner .h2 .tcursor { animation:blink 1s step-end infinite; font-weight:400; margin-left:1px; }
@keyframes blink { 50% { opacity:0; } }
#app .banner .bsub { color:rgba(255,255,255,.85); font-size:13px; letter-spacing:4px; margin-top:12px; }
#app .banner .scroll-down-bar { position:absolute; bottom:14px; left:0; right:0; text-align:center;
  color:#fff; font-size:22px; animation:floaty 2s ease-in-out infinite; cursor:pointer; z-index:2; }
@keyframes floaty { 0%,100% { transform:translateY(0);} 50% { transform:translateY(7px);} }
@keyframes fadeUp { from { opacity:0; transform:translateY(18px);} to { opacity:1; transform:none;} }
#app .fade-in-up { animation:fadeUp .8s ease both; }

/* ---------- 看板 Board（白色内容板，上叠横幅） ---------- */
#app .board-wrap { position:relative; z-index:5; margin-top:-56px; padding-bottom:34px; }
#app .board { background:var(--board); border-radius:3px; padding:26px 30px 34px;
  box-shadow:0 2px 5px 0 rgba(0,0,0,.16), 0 2px 10px 0 rgba(0,0,0,.12); min-height:40vh; }
#app .main { min-height:40vh; }
#app .crumbs { color:var(--txt3); font-size:12.5px; margin-bottom:16px; }
#app .crumbs b { color:var(--txt2); font-weight:600; }

/* ---------- 页脚 / 回顶部 ---------- */
#app .footer { padding:26px 0 30px; text-align:center; color:var(--txt3); font-size:12.5px; line-height:2; }
#app .footer a { color:var(--txt3); }
#app #scroll-top-button { position:fixed; right:18px; bottom:18px; z-index:1100; width:40px; height:40px;
  border-radius:4px; background:var(--board); color:var(--txt2); border:none; cursor:pointer; font-size:17px;
  box-shadow:0 2px 5px 0 rgba(0,0,0,.16), 0 2px 10px 0 rgba(0,0,0,.12);
  opacity:0; pointer-events:none; transition:.3s; }
#app #scroll-top-button.show { opacity:1; pointer-events:auto; }
#app #scroll-top-button:hover { color:var(--link); }

/* ---------- 卡片 / 面板 ---------- */
#app .card { background:var(--board); border:1px solid var(--line); border-radius:3px; padding:18px 20px; margin-bottom:18px; }
#app .card h3 { font-size:15.5px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
#app .card h3::before { content:""; width:4px; height:16px; border-radius:2px; background:var(--pri); display:inline-block; }
#app .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
#app .statgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px; }
#app .statgrid .s { background:var(--board); border:1px solid var(--line); border-radius:3px; padding:16px 12px; text-align:center;
  box-shadow:0 1px 3px rgba(0,0,0,.05); }
#app .statgrid .s .v { font-size:24px; font-weight:700; color:var(--link); margin-top:2px; }

/* ---------- 按钮 ---------- */
#app .btn { display:inline-flex; align-items:center; gap:6px; padding:7px 15px; border-radius:3px;
  border:1px solid var(--inputline); background:var(--board); color:var(--txt2); font-size:13px;
  cursor:pointer; transition:.18s; user-select:none; white-space:nowrap; font-family:inherit; }
#app .btn:hover { border-color:var(--pri); color:var(--pri); }

/* ---------- 打字机效果（Fluid typing） ---------- */
function typeText(el, text, speed){
  speed = speed || 70;
  if(!el) return;
  if(el._typing) { el._typing.stop = true; }
  const state = {stop:false}; el._typing = state;
  el.textContent = '';
  const cur = mk('span'); cur.className = 'tcursor'; cur.textContent = '_';
  el.appendChild(cur);
  let i = 0;
  (function tick(){
    if(state.stop) return;
    if(i < text.length){
      cur.insertAdjacentText('beforebegin', text[i]); i++;
      setTimeout(tick, speed);
    }
  })();
}

/* ---------- 迷你 ZIP（store 法，零依赖）：打包备份 / 解包恢复 ---------- */
const ZIP = (() => {
  const TBL = (() => { const t = new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; } return t; })();
  function crc32(buf){ const b = new Uint8Array(buf); let c = 0xFFFFFFFF;
    for(let i=0;i<b.length;i++) c = TBL[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0; }
  function dosTime(d){ return {
    t: ((d.getHours()<<11) | (d.getMinutes()<<5) | (d.getSeconds()>>1)) & 0xFFFF,
    dt: (((d.getFullYear()-1980)<<9) | ((d.getMonth()+1)<<5) | d.getDate()) & 0xFFFF };
  }
  function u16(v){ return [v&255,(v>>>8)&255]; }
  function u32(v){ return [v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255]; }
  // files: [{name, data:Uint8Array}]
  function create(files){
    const now = dosTime(new Date());
    const chunks = [], central = [];
    let offset = 0;
    const te = new TextEncoder();
    for(const f of files){
      const nameB = te.encode(f.name);
      const data = f.data instanceof Uint8Array ? f.data : new Uint8Array(f.data);
      const crc = crc32(data);
      const lh = [
        ...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0),
        ...u16(now.t), ...u16(now.dt), ...u32(crc),
        ...u32(data.length), ...u32(data.length), ...u16(nameB.length), ...u16(0)
      ];
      chunks.push(new Uint8Array(lh), nameB, data);
      central.push({nameB, crc, size:data.length, offset});
      offset += lh.length + nameB.length + data.length;
    }
    const cdStart = offset;
    for(const c of central){
      const ch = [
        ...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0),
        ...u16(now.t), ...u16(now.dt), ...u32(c.crc),
        ...u32(c.size), ...u32(c.size), ...u16(c.nameB.length),
        ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(c.offset)
      ];
      chunks.push(new Uint8Array(ch), c.nameB);
      offset += ch.length + c.nameB.length;
    }
    const eocd = [
      ...u32(0x06054b50), ...u16(0), ...u16(0),
      ...u16(central.length), ...u16(central.length),
      ...u32(offset - cdStart), ...u32(cdStart), ...u16(0)
    ];
    chunks.push(new Uint8Array(eocd));
    let total = 0; chunks.forEach(c=>total+=c.length);
    const out = new Uint8Array(total); let p = 0;
    chunks.forEach(c=>{ out.set(c,p); p+=c.length; });
    return out.buffer;
  }
  // 解析 store 法 zip → [{name, data:Uint8Array}]
  function parse(buf){
    const b = new Uint8Array(buf);
    const dv = new DataView(buf);
    // 从尾部找 EOCD
    let eocd = -1;
    for(let i = b.length - 22; i >= Math.max(0, b.length - 66000); i--){
      if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
    }
    if(eocd < 0) throw new Error('不是有效的ZIP备份文件');
    const cnt = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const td = new TextDecoder();
    const out = [];
    for(let i = 0; i < cnt; i++){
      if(dv.getUint32(p, true) !== 0x02014b50) throw new Error('ZIP目录损坏');
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true);
      const elen = dv.getUint16(p + 30, true);
      const clen = dv.getUint16(p + 32, true);
      const lho = dv.getUint32(p + 42, true);
      const name = td.decode(b.slice(p + 46, p + 46 + nlen));
      if(method !== 0) throw new Error('备份包含压缩数据，仅支持store法备份');
      const lnlen = dv.getUint16(lho + 26, true);
      const lelen = dv.getUint16(lho + 28, true);
      const dstart = lho + 30 + lnlen + lelen;
      out.push({name, data: b.slice(dstart, dstart + csize)});
      p += 46 + nlen + elen + clen;
    }
    return out;
  }
  return {create, parse, crc32};
})();

/* ---------- CP-ABE 轻量属性加密引擎 ----------
 * 方案：主密钥MS派生各属性密钥 K_a = HKDF(MS, info="attr|"+a)
 * 文件内容密钥CK随机，加密正文；按策略中每个属性a用K_a包裹CK；
 * 持有任一策略属性密钥者可解出CK并解密正文 —— 密文策略属性基加密的单属性策略简化实现。
 * 网盘上存储的 .cpabe 文件为纯密文，无属性密钥者即使拿到文件也无法读出内容。
 */
const CPABE = (() => {
  // 主密钥（混淆存储：XOR + base64）
  const _msX = 'WZIt1OahHGgTzJqjngw5RLDn3Xr8AYeFTmK5Ea62KQU=';
  const _mk = 'FZSY2026';
  let _ms = null;
  function ms(){ if(_ms) return _ms;
    const raw = U.unb64(_msX); const k = enc.encode(_mk);
    const out = new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) out[i] = raw[i] ^ k[i % k.length];
    _ms = out.buffer; return _ms;
  }
  const keyCache = {};
  async function attrKey(a){
    if(keyCache[a]) return keyCache[a];
    const base = await crypto.subtle.importKey('raw', ms(), 'HKDF', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      {name:'HKDF', hash:'SHA-256', salt: enc.encode('FZSY-CPABE-v1-salt'), info: enc.encode('attr|'+a)},
      base, 256);
    keyCache[a] = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['encrypt','decrypt']);
    return keyCache[a];
  }
  async function gcm(key, nonce, data){
    return crypto.subtle.encrypt({name:'AES-GCM', iv:nonce, tagLength:128}, key, data);
  }
  async function gcmDec(key, nonce, data){
    return crypto.subtle.decrypt({name:'AES-GCM', iv:nonce, tagLength:128}, key, data);
  }
  // 加密：policy = 属性数组
  async function encrypt(plainBuf, policy){
    const uniq = [...new Set(policy)];
    const ck = crypto.getRandomValues(new Uint8Array(32));
    const ckKey = await crypto.subtle.importKey('raw', ck, 'AES-GCM', false, ['encrypt','decrypt']);
    const head = [0x43,0x50,0x41,0x42,0x45,0x31]; // CPABE1
    const u16 = v => [v & 255, (v>>8) & 255];
    const parts = [new Uint8Array(head), new Uint8Array(u16(uniq.length))];
    for(const a of uniq){
      const ab = enc.encode(a);
      const nonceW = crypto.getRandomValues(new Uint8Array(12));
      const wrapped = await gcm(await attrKey(a), nonceW, ck);
      parts.push(new Uint8Array(u16(ab.length))); parts.push(ab);
      parts.push(nonceW); parts.push(new Uint8Array(wrapped));
    }
    const nonceB = crypto.getRandomValues(new Uint8Array(12));
    const body = await gcm(ckKey, nonceB, plainBuf);
    parts.push(nonceB); parts.push(new Uint8Array(body));
    let total = 0; parts.forEach(p=>total+=p.length);
    const out = new Uint8Array(total); let off=0;
    parts.forEach(p=>{ out.set(p, off); off+=p.length; });
    return out.buffer;
  }
  // 解密：myAttrs = 用户属性数组
  async function decrypt(buf, myAttrs){
    const b = new Uint8Array(buf);
    if(b.length < 8 || b[0]!==0x43 || b[1]!==0x50) throw new Error('不是CPABE密文');
    let off = 6;
    const rd16 = () => { const v = b[off] | (b[off+1]<<8); off+=2; return v; };
    const n = rd16();
    const wmap = {};
    for(let i=0;i<n;i++){
      const l = rd16();
      const attr = dec.decode(b.slice(off, off+l)); off+=l;
      const nonceW = b.slice(off, off+12); off+=12;
      const ct = b.slice(off, off+48); off+=48;
      wmap[attr] = {nonceW, ct};
    }
    const nonceB = b.slice(off, off+12); off+=12;
    const body = b.slice(off);
    let ck = null;
    for(const a of myAttrs){
      const w = wmap[a]; if(!w) continue;
      try { ck = await gcmDec(await attrKey(a), w.nonceW, w.ct); break; } catch(e){}
    }
    if(!ck) throw new Error('无满足策略的属性密钥');
    const ckKey = await crypto.subtle.importKey('raw', ck, 'AES-GCM', false, ['encrypt','decrypt']);
    return gcmDec(ckKey, nonceB, body);
  }
  return {encrypt, decrypt, ms};
})();

/* ---------- DOCX 正文提取（零依赖：ZIP 解析 + DecompressionStream 解压） ----------
 * 供「在线查看」提取 Word 文档正文：解析中央目录 → 取 word/document.xml →
 * deflate-raw 解压（浏览器原生）→ 按段落抽取文本。 */
const DOCX = (() => {
  async function inflateRaw(data){
    if(typeof DecompressionStream === 'undefined') throw new Error('当前浏览器不支持在线解压，请下载查看');
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([data]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  function centralEntries(b){
    const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
    let eocd = -1;
    for(let i = b.length - 22; i >= Math.max(0, b.length - 66000); i--){
      if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
    }
    if(eocd < 0) throw new Error('不是有效的 docx 文件');
    const cnt = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const td = new TextDecoder();
    const out = [];
    for(let i = 0; i < cnt; i++){
      if(dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true);
      const elen = dv.getUint16(p + 30, true);
      const clen = dv.getUint16(p + 32, true);
      const lho = dv.getUint32(p + 42, true);
      const name = td.decode(b.slice(p + 46, p + 46 + nlen));
      p += 46 + nlen + elen + clen;
      if(name.endsWith('/')) continue;
      const lnlen = dv.getUint16(lho + 26, true);
      const lelen = dv.getUint16(lho + 28, true);
      out.push({name, method, start: lho + 30 + lnlen + lelen, csize});
    }
    return out;
  }
  function xmlText(xml){
    const s = String(xml)
      .replace(/<w:tab[^>]*\/?>/g, '\t')
      .replace(/<w:br[^>]*\/?>/g, '\n')
      .replace(/<\/w:p>/g, '\n')
      .replace(/<[^>]+>/g, '');
    const map = {'&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"','&apos;':"'",'&#39;':"'",'&nbsp;':' '};
    return s.replace(/&(amp|lt|gt|quot|apos|#39|nbsp);/g, m2 => map[m2] || m2)
      .replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  }
  async function extractText(buf){
    const b = new Uint8Array(buf);
    const doc = centralEntries(b).find(x => x.name === 'word/document.xml');
    if(!doc) throw new Error('docx 中未找到正文(document.xml)');
    const raw = b.slice(doc.start, doc.start + doc.csize);
    const xmlBytes = doc.method === 0 ? raw : await inflateRaw(raw);
    return xmlText(new TextDecoder('utf-8').decode(xmlBytes));
  }
  return {extractText};
})();

/* ---------- 备份包加密（FZENC1 · PBKDF2 + AES-GCM，零依赖） ----------
 * 格式：'FZENC1'(6B) + salt(16B) + iv(12B) + AES-GCM(内容)
 * 用于「可选加密备份」：社长设置备份密码后，整个 ZIP/JSON 备份加密为 .fzenc 文件，
 * 恢复时输入密码解密；无密码者即使拿到备份包也无法读出任何内容。 */
const FZENC = (() => {
  const MAGIC = [0x46,0x5A,0x45,0x4E,0x43,0x31]; // FZENC1
  async function deriveKey(pwd, salt){
    const base = await crypto.subtle.importKey('raw', enc.encode(pwd), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      {name:'PBKDF2', hash:'SHA-256', salt, iterations:150000},
      base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  }
  function isEnc(buf){
    const b = new Uint8Array(buf);
    return b.length > 34 && MAGIC.every((v,i)=>b[i]===v);
  }
  async function encrypt(buf, pwd){
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(pwd, salt);
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv, tagLength:128}, key, buf);
    const out = new Uint8Array(34 + ct.byteLength);
    out.set(MAGIC, 0); out.set(salt, 6); out.set(iv, 22);
    out.set(new Uint8Array(ct), 34);
    return out.buffer;
  }
  async function decrypt(buf, pwd){
    const b = new Uint8Array(buf);
    if(!isEnc(buf)) throw new Error('不是加密备份文件');
    const salt = b.slice(6, 22), iv = b.slice(22, 34), ct = b.slice(34);
    const key = await deriveKey(pwd, salt);
    return crypto.subtle.decrypt({name:'AES-GCM', iv, tagLength:128}, key, ct);
  }
  return {encrypt, decrypt, isEnc};
})();

/* ---------- 哈希 ---------- */
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', enc.encode(str));
  return Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function pwdHash(salt, pwd){ return sha256Hex(salt + '|' + pwd); }

    } catch(e){ console.warn('令牌续期失败:', e.message || e); throw e; }
  }
  const mldq   = (mlbh) => call('ml/mldq', {mlbh: mlbh||0});
  const wjdq   = (mlbh) => call('wj/wjdq', {ip1:'', mlbh, req:{}});
  const addml  = (parentBh, name) => call('ml/addml', {ip1:'', mlbh:parentBh, bt:name, wjm:'', kqmm:'', pdgk:false, qx:'000101', req:{}});
  // 删除文件：必须用 wjs 批量载荷（Task-4 逆向结论；旧载荷 {bh,mlbh} 会静默失败导致文件堆积）
  const delwj  = (bh, dirBh) => call('wj/delwj', {mlbh: dirBh, kqmm:'', wjs:String(bh), xwjs:'', links:'', zmls:''});
  const hqpz   = (mlbh) => call('ml/hqpz', {mlbh, kqmm:'', lx:'sc', ymzd:6, fmax:30});

  // 上传（自动分片：≤2MB单片直传）。jsqHint 提供排序值时跳过目录探测，省一次网络往返
  async function upload(dirBh, fileName, dataBuf, onPct, jsqHint){
    const pz = await hqpz(dirBh);
    const scdz = pz.kj.scdz, scpz = pz.ml.scpz;
    const size = dataBuf.byteLength || dataBuf.size;
    // 排序值
    let jsq = 1000000;
    if(jsqHint != null){ jsq = jsqHint; }
    else {
      try {
        const lst = await wjdq(dirBh);
        const arr = (lst.lb||[]).map(f => (f.jsq || f.jsq===0) ? f.jsq : f.bh);
        if(arr.length) jsq = Math.max(...arr) + 1;
      } catch(e){}
    }
    const total = Math.max(1, Math.ceil(size / (2*1024*1024)));
    const b64name = U.b64u(enc.encode(fileName));
    let last = null;
    for(let c=0;c<total;c++){
      const chunk = dataBuf.slice ? dataBuf.slice(c*2*1024*1024, (c+1)*2*1024*1024) : new Uint8Array(dataBuf).slice(c*2*1024*1024, (c+1)*2*1024*1024).buffer;
      const fd = new FormData();
      fd.append('dlmc', DLMC); fd.append('scpz', scpz); fd.append('zmlmc','');
      fd.append('jsq', String(jsq)); fd.append('pdgk','1'); fd.append('bz','');
      fd.append('fsize', String(size)); fd.append('isbm','1'); fd.append('gid','');
      fd.append('file', new Blob([chunk]), b64name);
      fd.append('chunkIndex', String(c)); fd.append('totalfps', String(total));
      const r = await fetch(scdz, {method:'POST', body:fd});
      const t = await r.text();
      if(r.status !== 200) throw new Error('上传失败: ' + t.slice(0,100));
      if(total === 1){ last = JSON.parse(t); }
      if(onPct) onPct(Math.round(((c+1)/total)*100));
    }
    return last; // {bh,dx,fwq,rq,pz}
  }
  // 直接读JSON文件（免鉴权）
  async function readJSON(url){
    const r = await fetch(url + (url.includes('?')?'&':'?') + 't=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('读取失败 ' + r.status);
    return r.json();
  }
  function dlUrl(file, xzpz){
    return `https://ys-${file.fwq.toLowerCase()}.ysepan.com/wap/${DLMC}/${xzpz}/${file.pz}/${encodeURIComponent(file.wjm)}`;
  }
  return {boot, call, renew, recoverWithToken, mldq, wjdq, addml, delwj, hqpz, upload, readJSON, dlUrl,
    get tk(){return tk;}, tkExp, DLMC, onAuthFail,
    addExtra: pushExtra, candidates: () => [...new Set([tk, ...extraTks, BOOT_GUEST].filter(Boolean))],
    bootExp: () => { try{ const p = BOOT_GUEST.split('.')[1]; const j = atob(p.replace(/-/g,'+').replace(/_/g,'/'));
      return JSON.parse(decodeURIComponent(Array.from(U.unb64(j), x=> '%'+x.toString(16).padStart(2,'0')).join(''))).exp*1000 || 0;
    }catch(e){ return 0; } }};
})();

/* ---------- 组织与权限引擎 ---------- */
const ORG = (() => {
  const CLUBS = ['摄影社','信息素养小组'];
  const DEPTS = {
    '摄影社': ['摄影部门','后期部门','运营部门'],
    '信息素养小组': ['比赛部门','活动部门']
  };
  const GRANTERS = ['社长','副社长-摄影社','副社长-信息素养小组','秘书处-处长'];
  const LEVELS = {'社长':5,'副社长':4,'处长':4,'副处长':3,'干事':2,'社员':1};
  // 密级 → 数值等级（归档者只能设置自己权限等级及以下的密级）
  const LEVEL_NUM = {'公开级':1,'部门级':1,'干事级':2,'核心级':3,'社长级':5};
  const LEVEL_ORDER = ['公开级','部门级','干事级','核心级','社长级'];
  function canSetLevel(u, level){ return (LEVEL_NUM[level]||1) <= levelOf(u.attrs); }
  function settableLevels(u){ return LEVEL_ORDER.filter(l => canSetLevel(u, l)); }
  function levelOf(attrs){
    let lv = 0;
    for(const a of attrs||[]){
      if(a === '社长') lv = Math.max(lv, 5);
      else if(a.startsWith('副社长-')) lv = Math.max(lv, 4);
      else if(a === '秘书处-处长') lv = Math.max(lv, 4);
      else if(a === '秘书处-副处长') lv = Math.max(lv, 3);
      else if(a.endsWith('-干事')) lv = Math.max(lv, 2);
    }
    return lv || 1; // '社员'
  }
  function isGrantor(u){ return (u.attrs||[]).some(a => GRANTERS.includes(a)); }
  function isShezhang(u){ return (u.attrs||[]).includes('社长'); }
  function myDeptAttr(u, club, dept){ return `${club}-${dept}-`; }
  function clubOf(u){
    for(const c of CLUBS){ if((u.attrs||[]).some(a=>a.startsWith(c+'-'))) return c; }
    return null;
  }
  function deptOf(u){
    for(const a of (u.attrs||[])){
      const m = a.match(/^(摄影社|信息素养小组)-(.+)-(干事|社员)$/);
      if(m) return {club:m[1], dept:m[2], role:m[3]};
    }
    return null;
  }
  function isMishuchu(u){ return (u.attrs||[]).some(a=>a.startsWith('秘书处-')); }
  return {CLUBS, DEPTS, GRANTERS, LEVEL_NUM, LEVEL_ORDER, levelOf, isGrantor, isShezhang, clubOf, deptOf, isMishuchu, canSetLevel, settableLevels};
})();

/* ---------- 目录权限模型 ---------- */
/* 每个目录节点: {id, name, bh, parent, scope:{kind, club?, dept?}|null, kind}
 * kind: 'root'|'club'(俱乐部节点)|'dept'(部门)|'sec'(秘书处)|'pub'|'common'|'shz'(社长室)|'custom'
 * 权限判定函数见下 */
const PERM = (() => {
  function treeParents(fid, folders){
    const chain = []; let cur = folders.find(f=>f.id===fid);
    while(cur){ chain.unshift(cur); cur = cur.parent ? folders.find(f=>f.id===cur.parent) : null; }
    return chain;
  }
  function canViewF(f, u, folders, grants){
    if(ORG.isShezhang(u)) return true;
    if(grants && grants.some(g => g.user===u.id && (!g.folderId || g.folderId===f.id) && g.until > Date.now())) return true;
    if(f.kind === 'root') return true;
    if(f.kind === 'pub') return true;
    if(f.kind === 'common') return true; // 全社通：全体登录社员
    if(f.kind === 'dept'){
      const da = ORG.deptOf(u);
      if(da && da.club===f.scope.club && da.dept===f.scope.dept) return true;
      if((u.attrs||[]).includes('副社长-'+f.scope.club)) return true;
      if(ORG.isMishuchu(u)) return true; // 秘书处共同管理协调
      return false;
    }
    if(f.kind === 'club'){ // 俱乐部节点（含部门列表）：本社社员可见
      if(ORG.clubOf(u) === f.scope.club) return true;
      if((u.attrs||[]).includes('副社长-'+f.scope.club)) return true;
      if(ORG.isMishuchu(u)) return true;
      return false;
    }
    if(f.kind === 'sec'){ return ORG.isMishuchu(u) || (u.attrs||[]).includes('社长'); }
    if(f.kind === 'shz'){ return false; } // 仅社长（上面已放行）
    return false;
  }
  function canUpF(f, u){
    if(ORG.isShezhang(u)) return true;
    if(ORG.isGrantor(u) && (f.kind==='pub'||f.kind==='common'||f.kind==='sec')) return true;
    if(f.kind === 'pub' || f.kind === 'common'){
      return ORG.levelOf(u.attrs) >= 2; // 干事及以上 + 秘书处干事
    }
    if(f.kind === 'dept'){
      const da = ORG.deptOf(u);
      return da && da.club===f.scope.club && da.dept===f.scope.dept && da.role==='干事';
    }
    if(f.kind === 'sec'){ return (u.attrs||[]).some(a=>a.startsWith('秘书处-')); }
    return false;
  }
  function canDelF(f, u){ return ORG.isShezhang(u) || (u.attrs||[]).includes('秘书处-处长'); }
  function canModifyEntry(e, u){ return ORG.isShezhang(u) || (u.attrs||[]).includes('秘书处-处长') || e.uploaderId===u.id; }
  // 密级 → 解密属性集合
  function policyOf(level, f){
    const S = '社长', CZ = '秘书处-处长', FCZ = '秘书处-副处长';
    if(level === '公开级') return ['社员'];
    if(level === '社长级') return [S];
    if(level === '核心级') return [S, CZ, FCZ];
    if(f && f.kind === 'dept'){
      const {club, dept} = f.scope;
      if(level === '干事级') return [`${club}-${dept}-干事`, `副社长-${club}`, CZ, FCZ, S];
      return [`${club}-${dept}-干事`, `${club}-${dept}-社员`, `副社长-${club}`, CZ, FCZ, S]; // 部门级
    }
    if(f && (f.kind==='sec')) return ['秘书处-处长','秘书处-副处长','秘书处-干事','副社长-摄影社','副社长-信息素养小组', S];
    if(f && f.kind === 'shz') return [S];
    return ['社员'];
  }
  return {canViewF, canUpF, canDelF, canModifyEntry, policyOf, treeParents};
})();

'use strict';

/* 所有数据文件存于 WebTemp 目录：
 *  读: wjdq(WebTemp)一次取全列表 → 各 JSON 免鉴权 wap 并行直读
 *  写: 上传新版本 → 异步清理同名旧版本（不阻塞写入返回）
 *  兜底: 网盘最新版 → localStorage 快照 → 默认结构（确保数据不丢失、系统可启动）
 *  并发: 最后写入者胜出（bh最大），关键文件带重试 */
const Store = (() => {
  let cfg=null, users=null, meta=null, logs=null, notices=null, requests=null, points=null;
  let WT = null; // {bh}

  const FILES = ['config','users','meta','logs','notices','requests','points'];
  const state = () => ({config:cfg, users, meta, logs, notices, requests, points});
  function setState(n, v){ if(n==='config')cfg=v; else if(n==='users')users=v; else if(n==='meta')meta=v;
    else if(n==='logs')logs=v; else if(n==='notices')notices=v; else if(n==='requests')requests=v; else points=v; }

  /* ---------- localStorage 快照（浏览器端最后防线） ---------- */
  const LS = {
    key: n => 'fzsy_snap_' + n,
    set(n, obj){ try{ localStorage.setItem(this.key(n), JSON.stringify(obj)); }catch(e){} },
    get(n){ try{ const s = localStorage.getItem(this.key(n)); return s ? JSON.parse(s) : null; }catch(e){ return null; } },
    status(){ return FILES.map(n => ({name:n, has: !!localStorage.getItem(this.key(n))})); }
  };

  /* ---------- WebTemp 目录列表缓存（6s TTL，减少 wjdq 往返） ---------- */
  let _dir = null, _dirTs = 0;
  const DIR_TTL = 6000;
  async function dirList(force){
    if(!force && _dir && Date.now() - _dirTs < DIR_TTL) return _dir;
    const r = await YST.wjdq(WT.bh);
    _dir = r; _dirTs = Date.now();
    return r;
  }

  function init(bh){ WT = {bh}; }

  // 解析某数据文件的当前版本（复用目录缓存）
  async function resolve(name){
    const {lb, ml} = await dirList(false);
    const list = (lb||[]).filter(f=>f.wjm === name + '.json').sort((a,b)=>b.bh-a.bh);
    return {latest: list[0]||null, xzpz: ml.xzpz};
  }
  async function readFile(name){
    const {latest, xzpz} = await resolve(name);
    if(!latest) throw new Error('数据文件缺失: ' + name);
    return YST.readJSON(YST.dlUrl(latest, xzpz));
  }

  /* ---------- 写队列（合并短窗口内同一文件的多次写入，仅上传最新内存态） ---------- */
  const _wq = {};
  const _dirty = new Set();              // 写入失败待重试集合（数据不丢失：周期/卸载时冲刷）
  function markDirty(n){ _dirty.add(n); }
  function scheduleWrite(name){
    if(_wq[name]) return _wq[name].promise;    // 350ms 窗口内的后续修改合并为一次上传
    const entry = {};
    entry.promise = new Promise((res, rej)=>{ entry.resolve=res; entry.reject=rej; });
    _wq[name] = entry;
    setTimeout(async () => {
      delete _wq[name];
      const snap = state()[name];
      try { await writeFile(name); _dirty.delete(name); entry.resolve(); }
      catch(e){
        LS.set(name, snap);              // 上传失败也先落本机快照（数据不丢失第一防线）
        markDirty(name); entry.reject(e);
      }
    }, 350);
    return entry.promise;
  }

  async function writeFile(name){
    const data = state()[name];
    data._ts = Date.now();
    const json = JSON.stringify(data, null, 1);
    // 排序值递增（免 wjdq 探测），旧版本清理异步执行不阻塞
    const jsq = nextJsq(WT.bh);
    await YST.upload(WT.bh, name + '.json', enc.encode(json).buffer, null, jsq);
    LS.set(name, data);                        // 浏览器端快照（兜底恢复用）
    cleanupVersions(name);                     // 异步清理，不阻塞
  }
  // 同名旧版本异步清理（失败不影响系统，下次写入再清理）
  function cleanupVersions(name){
    (async () => {
      const {lb} = await dirList(true);
      const mine = (lb||[]).filter(f=>f.wjm===name+'.json').sort((a,b)=>b.bh-a.bh);
      await Promise.all(mine.slice(1).map(f => YST.delwj(f.bh, WT.bh).catch(()=>{})));
    })().catch(()=>{});
  }
  // 目录排序值序列（内存递增，避免每次上传前的 wjdq 探测）
  const _seq = {};
  function nextJsq(dirBh){
    if(!_seq[dirBh]) _seq[dirBh] = 1000000 + (Date.now() % 800000000);
    return ++_seq[dirBh];
  }

  // 恢复备用：直接上传一份 JSON 数据文件（不改内存态）
  async function putDataFile(name, jsonObj){
    const json = JSON.stringify(jsonObj, null, 1);
    await YST.upload(WT.bh, name + '.json', enc.encode(json).buffer, null, nextJsq(WT.bh));
    LS.set(name, jsonObj);
    cleanupVersions(name);
  }
  // 结构兜底（文件缺失/损坏时保证系统可启动，不中断）
  function defaults(n){
    switch(n){
      case 'config':  return {folders:[], batch:{}, batchKinds:null, recordBehavior:true};
      case 'users':   return {items:[]};
      case 'meta':    return {items:[]};
      case 'logs':    return {items:[]};
      case 'notices': return {items:[]};
      case 'requests':return {access:[], grants:[], video:[]};
      case 'points':  return {ledger:[]};
    }
    return {};
  }
  // 并行加载：一次 wjdq → 全部 JSON 并行直读（启动提速的核心：14次串行往返 → 2次并行往返）
  async function loadAll(){
    const {lb, ml} = await dirList(true);
    const latest = {};
    for(const f of (lb||[])){
      if(!f.wjm || !f.wjm.endsWith('.json')) continue;
      const n = f.wjm.slice(0, -5);
      if(!latest[n] || f.bh > latest[n].bh) latest[n] = f;
    }
    await Promise.all(FILES.map(async n => {
      if(!latest[n]){
        const snap = LS.get(n);
        setState(n, snap || defaults(n));
        return;
      }
      try { setState(n, await YST.readJSON(YST.dlUrl(latest[n], ml.xzpz))); }
      catch(e){
        console.warn('数据文件读取失败，使用快照兜底:', n, e.message||e);
        const snap = LS.get(n);
        if(snap) setState(n, snap); else setState(n, defaults(n));
      }
    }));
    // 结构健壮性补齐
    for(const n of FILES){
      const v = state()[n];
      if(!v || typeof v !== 'object') setState(n, defaults(n));
    }
    if(!cfg.folders) cfg.folders = [];
    if(!users.items) users.items = [];
    if(!meta.items) meta.items = [];
    if(!logs.items) logs.items = [];
    if(!notices.items) notices.items = [];
    if(!requests.access) requests.access = [];
    if(!requests.grants) requests.grants = [];
    if(!requests.video) requests.video = [];
    if(!points.ledger) points.ledger = [];
    _degraded = false;
    return state();
  }
  /* ---------- 降级模式：网盘令牌链条全失效时，用本机快照启动（可登录/浏览/操作，
   * 操作数据留在本机快照，令牌恢复后由冲刷/写回机制同步回网盘，不丢失） ---------- */
  let _degraded = false;
  function loadAllFallback(){
    let has = false;
    for(const n of FILES){
      const s = LS.get(n);
      if(s){ setState(n, s); has = true; } else setState(n, defaults(n));
    }
    if(!cfg.folders) cfg.folders = [];
    if(!users.items) users.items = [];
    if(!meta.items) meta.items = [];
    if(!logs.items) logs.items = [];
    if(!notices.items) notices.items = [];
    if(!requests.access) requests.access = [];
    if(!requests.grants) requests.grants = [];
    if(!requests.video) requests.video = [];
    if(!points.ledger) points.ledger = [];
    _degraded = true;
    return has;
  }
  // 数据健康自检（管理面板「数据与回收站」用）
  function healthCheck(){
    const rows = [];
    const names = {config:'系统配置', users:'账号数据', meta:'文档注册表', logs:'行为日志',
      notices:'通知', requests:'审批申请', points:'积分台账'};
    for(const n of FILES){
      const v = state()[n];
      const cnt = v ? (v.items ? v.items.length : (v.ledger ? v.ledger.length : (v.access ? v.access.length+ (v.grants||[]).length + (v.video||[]).length : '-'))) : 0;
      const ts = v && v._ts ? v._ts : null;
      rows.push({name:n, label:names[n]||n, ok:!!v, cnt, ts, snap: !!LS.get(n)});
    }
    return rows;
  }
  // 全量写回网盘（数据保险：内存态强制持久化）
  async function forceWriteAll(onProg){
    let i = 0;
    for(const n of FILES){
      i++;
      if(onProg) onProg(Math.round(i/FILES.length*100), `写回 ${n}.json`);
      await writeFile(n);
      _dirty.delete(n);
    }
  }

  /* ---------- 数据不丢失保险：脏文件周期/卸载冲刷 ---------- */
  let _flushTimer = null;
  function dirtyNames(){ return [..._dirty]; }
  async function flushDirty(){
    const names = [..._dirty];
    for(const n of names){
      try { await writeFile(n); _dirty.delete(n); } catch(e){ break; }
    }
    return {flushed: names.length - _dirty.size, remain: _dirty.size};
  }
  function startFlushTimer(){
    if(_flushTimer) return;
    _flushTimer = setInterval(() => { if(_dirty.size) flushDirty().catch(()=>{}); }, 45000);
    const onHide = () => {
      if(!_dirty.size) return;
      for(const n of [..._dirty]){ try{ writeFile(n); }catch(e){} }  // 尽力发出（配合 LS 快照双保险）
      _dirty.clear();
    };
    document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') onHide(); });
    window.addEventListener('pagehide', onHide);
  }
  function isDegraded(){ return _degraded; }

  /* ---------- 一键备份 / 恢复（仅社长与秘书处处长） ---------- */
  function tsStamp(){ const d = new Date(); const p = n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
  function snapshot(){
    const data = {};
    for(const f of ['config','users','meta','logs','notices','requests','points']) data[f] = JSON.parse(JSON.stringify(state()[f]));
    return data;
  }
  /* 备份选项：opts.plainDocs=明文导出（仅社长）· opts.password=整包加密(.fzenc) */
  async function backupAll(includeDocs, opts, onProg){
    const u = Session.user();
    opts = opts || {};
    const stamp = tsStamp();
    const data = snapshot();
    const manifest = {app:'FZSY-Docs', ver:3, ts:Date.now(), by:u.displayName, webtempBh:WT.bh,
      docState: opts.plainDocs ? 'plain' : 'encrypted', zipPass: !!opts.password,
      folders:(cfg.folders||[]).map(f=>({id:f.id, name:f.name, bh:f.bh})), docs:[]};
    if(opts.plainDocs && !ORG.isShezhang(u)) throw new Error('明文导出仅社长可操作');
    await log(u, '一键备份', includeDocs?'完整备份(ZIP)':'数据备份(JSON)',
      (opts.plainDocs?'文档明文':'文档保持密文')+(opts.password?'·包加密':''), '开始');
    const finish = async (kind, buf, base) => {
      if(opts.password){
        if(onProg) onProg(99, '备份包加密中…');
        buf = await FZENC.encrypt(buf, opts.password);
        await log(u, '一键备份', base.name.replace(/\.(zip|json)$/, '')+'.fzenc', '已加密为 .fzenc', '成功');
        return {kind:'enc', name:base.name.replace(/\.(zip|json)$/, '') + '.fzenc', buf, manifest};
      }
      await log(u, '一键备份', base.name, `文档 ${manifest.docs.length} 份`, '成功');
      return {kind, name:base.name, buf, manifest};
    };
    if(!includeDocs){
      const blob = JSON.stringify({_backup:'FZSY', meta:manifest, data}, null, 1);
      if(onProg) onProg(100, '数据打包完成');
      return finish('json', enc.encode(blob).buffer, {name:`社团文档系统数据备份_${stamp}.json`});
    }
    // 完整备份：data/ + docs/<目录>/<文件>
    const files = [];
    files.push({name:'manifest.json', data: enc.encode(JSON.stringify(manifest, null, 1))});
    for(const f of Object.keys(data))
      files.push({name:`data/${f}.json`, data: enc.encode(JSON.stringify(data[f], null, 1))});
    const entries = allEntries();
    for(let i=0;i<entries.length;i++){
      const e = entries[i];
      const folder = cfg.folders.find(x=>x.id===e.folderId) || {name:'未知目录'};
      if(onProg) onProg(Math.round(i/entries.length*90), `取回文档 ${i+1}/${entries.length}：${e.name}`);
      try {
        const raw = new Uint8Array(await fetchRaw(e));
        let payload = raw, encrypted = !!e.encrypted, note = '';
        // 明文导出（社长选项）：用本人属性解密；失败则保持密文并在 manifest 标注
        if(e.encrypted && opts.plainDocs){
          try {
            const myAttrs = [...new Set([...(u.attrs||[]), '社员'])];
            payload = new Uint8Array(await CPABE.decrypt(raw.buffer.slice(raw.byteOffset, raw.byteOffset+raw.byteLength), myAttrs));
            encrypted = false; note = '已解密';
          } catch(de){ note = '解密失败(保持密文)'; }
        }
        const safe = (folder.name + '/' + e.id + '_' + e.name).replace(/[\\/:*?"<>|]/g, '_') + (encrypted ? '.cpabe' : '');
        files.push({name:'docs/' + safe, data: payload});
        manifest.docs.push({id:e.id, folderId:e.folderId, folder:folder.name, name:e.name,
          level:e.level, batchNo:e.batchNo||'', encrypted, note, zipPath:'docs/' + safe});
      } catch(err){ manifest.docs.push({id:e.id, name:e.name, error:String(err.message||err).slice(0,80)}); }
    }
    // manifest 补充后重写
    const mi = files.findIndex(f=>f.name==='manifest.json');
    files[mi] = {name:'manifest.json', data: enc.encode(JSON.stringify(manifest, null, 1))};
    files.push({name:'README.txt', data: enc.encode([
      '社团文档归档权限系统 · 完整备份', '',`备份时间：${U.fmtTs(manifest.ts)}`,`操作人：${manifest.by}`,
      `文档数：${manifest.docs.length}（${manifest.docState==='plain'?'已解密为明文':'保持加密状态'}）`, '',
      '- data/ 目录：系统全部数据文件（账号/注册表/日志/通知/申请/积分/配置）',
      '- docs/ 目录：全部归档文档（' + (manifest.docState==='plain'
        ? '按操作人选择已解密为明文，请注意妥善保管'
        : '.cpabe 为 CP-ABE 密文，保持加密状态，外泄不可读）'),
      opts.password ? '- 本备份包整体已用 AES-256 加密（.fzenc），恢复时需输入备份密码。' : '',
      '- 恢复：进入系统「一键备份」面板 → 导入此备份，系统将重上传数据与文档并重建索引。',
    ].filter(Boolean).join('\n'))});
    if(onProg) onProg(96, '打包 ZIP 中…');
    const buf = ZIP.create(files);
    if(onProg) onProg(100, '打包完成');
    return finish('zip', buf, {name:`社团文档系统完整备份_${stamp}.zip`});
  }
  async function restoreBackup(fileBuf, fname, opts, onProg){
    const u = Session.user();
    opts = opts || {};
    const report = {data:0, docs:0, docsFail:0, reEnc:0, decrypted:false};
    let raw = fileBuf;
    // 加密备份：FZENC1 魔数 → 用备份密码解出内层 ZIP/JSON
    if(FZENC.isEnc(raw)){
      if(!opts.password) throw new Error('此备份包已加密，请先输入备份密码');
      if(onProg) onProg(2, '备份包解密中…');
      try { raw = await FZENC.decrypt(raw, opts.password); report.decrypted = true; }
      catch(e){ throw new Error('备份密码错误，无法解密备份包'); }
    }
    const b0 = new Uint8Array(raw);
    const isZip = (/\.zip$/i.test(fname)) || (b0.length>2 && b0[0]===0x50 && b0[1]===0x4B);
    let dataObjs = null, docList = [];
    if(isZip){
      const items = ZIP.parse(raw);
      const map = {}; items.forEach(it=>map[it.name] = it.data);
      dataObjs = {};
      for(const f of ['config','users','meta','logs','notices','requests','points']){
        const p = `data/${f}.json`;
        if(map[p]) dataObjs[f] = JSON.parse(dec.decode(map[p]));
      }
      if(map['manifest.json']){
        const mf = JSON.parse(dec.decode(map['manifest.json']));
        docList = (mf.docs||[]).filter(d=>d.zipPath && map[d.zipPath]);
      }
    } else {
      const j = JSON.parse(dec.decode(new Uint8Array(raw)));
      if(j._backup !== 'FZSY' || !j.data) throw new Error('不是本系统的备份文件');
      dataObjs = j.data; docList = [];
    }
    if(!dataObjs || !dataObjs.users) throw new Error('备份内缺少必要数据文件');
    // 1. 重上传数据文件
    for(let i=0;i<FILES.length;i++){
      const f = FILES[i];
      if(!dataObjs[f]) continue;
      if(onProg) onProg(Math.round(i/FILES.length*40), `恢复数据 ${f}.json`);
      await putDataFile(f, dataObjs[f]);
      report.data++;
    }
    // 2. 重上传文档并重建指针（明文备份的加密文档按其密级自动重新加密后归档）
    for(let i=0;i<docList.length;i++){
      const d = docList[i];
      if(onProg) onProg(40 + Math.round(i/Math.max(1,docList.length)*55), `恢复文档 ${i+1}/${docList.length}：${d.name}`);
      try {
        const items = ZIP.parse(raw);
        const rawDoc = (items.find(it=>it.name===d.zipPath)||{}).data;
        if(!rawDoc) throw new Error('包内缺失');
        const folder = (dataObjs.config.folders||[]).find(x=>x.id===d.folderId);
        const dirBh = folder ? folder.bh : WT.bh;
        let payload = rawDoc, encrypted = !!d.encrypted;
        if(encrypted){
          const isCipher = rawDoc.length>2 && rawDoc[0]===0x43 && rawDoc[1]===0x50; // 'CP' = CPABE 密文
          if(!isCipher){
            const policy = PERM.policyOf(d.level||'公开级', folder || null);
            payload = new Uint8Array(await CPABE.encrypt(rawDoc.slice().buffer, policy));
            report.reEnc++;
          }
        }
        const diskname = d.name + (encrypted ? '.cpabe' : '');
        const disk = await YST.upload(dirBh, diskname, payload.slice().buffer, null, nextJsq(dirBh));
        // 更新 meta 指针
        const metaObj = dataObjs.meta;
        const it2 = (metaObj.items||[]).find(x=>x.id===d.id);
        if(it2){ it2.disk = {bh:disk.bh, fwq:disk.fwq, pz:disk.pz}; it2.encrypted = encrypted;
          try { const {ml} = await YST.wjdq(dirBh); it2.xzpz = ml.xzpz; } catch(e){} }
        report.docs++;
      } catch(err){ report.docsFail++; }
    }
    if(report.docs > 0){ await putDataFile('meta', dataObjs.meta); }
    // 3. 重载
    await Store.loadAll();
    await log(u, '恢复备份', fname,
      `数据${report.data}份 文档${report.docs}份${report.reEnc?` 重加密${report.reEnc}份`:''}${report.docsFail?(' 失败'+report.docsFail):''}`, '成功');
    return report;
  }

  /* ---------- 周期自动备份（数据不丢失保险 · 仅社长/处长，静默触发） ---------- */
  function canAutoBackup(u){ return ORG.isShezhang(u) || (u.attrs||[]).includes('秘书处-处长'); }
  async function maybeAutoBackup(u, force){
    if(!canAutoBackup(u)) return {skipped:true, reason:'权限'};
    const ab = (cfg && cfg.autoBackup) || {};
    if(!force && ab.ts && Date.now() - ab.ts < 7*86400*1000) return {skipped:true, reason:'周期未到'};
    const stamp = tsStamp();
    const data = snapshot();
    const blob = JSON.stringify({_backup:'FZSY', auto:true, ts:Date.now(), by:u.displayName, data}, null, 1);
    const fname = `自动备份_${stamp}.json`;
    await YST.upload(WT.bh, fname, enc.encode(blob).buffer, null, nextJsq(WT.bh));
    try {   // 滚动保留最近 3 份
      const {lb} = await dirList(true);
      const autos = (lb||[]).filter(f=>/^自动备份_\d{8}_\d{4}\.json$/.test(f.wjm)).sort((a,b)=>a.bh-b.bh);
      await Promise.all(autos.slice(0, Math.max(0, autos.length-3)).map(f => YST.delwj(f.bh, WT.bh).catch(()=>{})));
    } catch(e){}
    await upd('config', C => { C.autoBackup = {ts:Date.now(), by:u.displayName}; });
    await log(u, '自动备份', fname, force?'手动触发周期备份':'7天周期数据保险', '成功');
    return {ok:true, name:fname};
  }
  async function listAutoBackups(){
    const {lb, ml} = await dirList(true);
    return (lb||[]).filter(f=>/^自动备份_\d{8}_\d{4}\.json$/.test(f.wjm))
      .sort((a,b)=>b.bh-a.bh)
      .map(f=>({bh:f.bh, name:f.wjm, size:f.dx, url:YST.dlUrl(f, ml.xzpz)}));
  }
  async function restoreAuto(item, onProg){
    const u = Session.user();
    if(!canAutoBackup(u)) throw new Error('仅社长与秘书处处长可恢复自动备份');
    const j = await YST.readJSON(item.url);
    if(!j || j._backup !== 'FZSY' || !j.data) throw new Error('自动备份文件无效');
    return restoreBackup(enc.encode(JSON.stringify(j)).buffer, item.name, {}, onProg);
  }

  /* ---------- 回收站（软删除文档恢复 / 彻底清除） ---------- */
  function deletedEntries(){ return (meta.items||[]).filter(e=>e.deleted); }
  async function restoreEntry(e, u){
    await update('meta', M2 => { const t=M2.items.find(x=>x.id===e.id); if(t){ t.deleted=false; delete t.delBy; delete t.delTs; } });
    await log(u, '恢复文档', e.name, '从回收站恢复', '成功');
  }
  async function purgeEntry(e, u){
    const folder = cfg.folders.find(f=>f.id===e.folderId);
    const dirBh = folder ? folder.bh : WT.bh;
    const targets = [e.disk, ...((e.history||[]).map(h=>h.disk))].filter(Boolean);
    await Promise.all(targets.map(d => YST.delwj(d.bh, dirBh).catch(()=>{})));
    await update('meta', M2 => { M2.items = M2.items.filter(x=>x.id!==e.id); });
    await log(u, '彻底删除', e.name, `网盘文件 ${targets.length} 个已清除`, '成功');

  // 抽样验证文档在网盘的可达性（数据健康检查）
  async function probeEntries(sampleN){
    const entries = allEntries();
    const sorted = entries.slice().sort((a,b)=>(a.size||0)-(b.size||0)).slice(0, sampleN||3);
    const out = [];
    for(const e of sorted){
      try {
        const r = await fetch(YST.dlUrl(e.disk, e.xzpz || (cfg.folders.find(f=>f.id===e.folderId)||{}).xzpz), {method:'GET', cache:'no-store'});
        out.push({id:e.id, name:e.name, ok:r.ok, status:r.status});
        try{ if(r.body) await r.body.cancel(); }catch(_){}
      } catch(err){ out.push({id:e.id, name:e.name, ok:false, status:String(err.message||err).slice(0,40)}); }
    }
    return out;
  }
  // 读-改-写 + 失败重试（重试时重读最新；写入经合并队列，短窗口多次修改只上传一次）
  async function update(name, mutator){
    for(let i=0;i<3;i++){
      try {
        if(i>0) setState(name, await readFile(name));
        mutator(state()[name]);
        await scheduleWrite(name);
        return;
      } catch(e){
        if(i===2){ markDirty(name); throw e; }
        await new Promise(r=>setTimeout(r, 400+i*500));
      }
    }
  }
  const M = {
    config:o=>f=>{f(o)}, // 占位
  };

  /* ---------- 密码保险库（社长专属：加密保存/查看账号密码） ----------
   * 密码哈希不可逆，无法“查看原密码”；保险库由社长自定义保险库密码，
   * 用 FZENC（PBKDF2 + AES-256-GCM）加密后存于 config.vault，
   * 只有输入保险库密码才能查看，满足“社长可修改、查看账号密码”的需求。 */
  function vaultEnabled(){ return !!(cfg && cfg.vault && cfg.vault.data); }
  async function vaultRead(pwd){
    if(!vaultEnabled()) return [];
    const buf = U.unb64(cfg.vault.data);
    const plain = await FZENC.decrypt(buf.buffer.slice(buf.byteOffset, buf.byteOffset + buf.byteLength), pwd);
    return JSON.parse(dec.decode(plain));
  }
  async function vaultWrite(list, pwd){
    const buf = await FZENC.encrypt(enc.encode(JSON.stringify(list)).buffer, pwd);
    const data = U.b64u(buf);
    await upd('config', C => { C.vault = {v:1, data, ts:Date.now()}; });
  }
  async function vaultInit(operator, pwd){
    if(!ORG.isShezhang(operator)) throw new Error('仅社长可管理密码保险库');
    if(pwd.length < 6) throw new Error('保险库密码至少 6 位');
    await vaultWrite([], pwd);
    await log(operator, '密码保险库', '初始化', '', '成功');
  }
  async function vaultAdd(operator, pwd, entry){
    if(!ORG.isShezhang(operator)) throw new Error('仅社长可管理密码保险库');
    const list = await vaultRead(pwd);
    const i = list.findIndex(x=>x.username===entry.username);
    if(i>=0) list[i] = entry; else list.push(entry);
    await vaultWrite(list, pwd);
    await log(operator, '密码保险库', entry.username, i>=0?'更新记录':'新增记录', '成功');
  }
  async function vaultOpen(operator, pwd){
    if(!ORG.isShezhang(operator)) throw new Error('仅社长可查看密码保险库');
    const list = await vaultRead(pwd);
    await log(operator, '密码保险库', '查看', `${list.length} 条记录`, '成功');
    return list;
  }

  /* ---------- 文书生成 ---------- */
  async function genDoc(operator, form){
    const {no, key} = nextBatchNo(form.kind);
    const y = new Date().getFullYear();
    const accounts = (form.aboutIds||[]).map(id=>{ const u=users.items.find(x=>x.id===id); return u?u.displayName+'（'+u.gradeClass+'）':''; }).filter(Boolean);
    let bodyText = form.body || '';
    if(accounts.length){ bodyText = bodyText.replace(/【相关账号】/g, accounts.join('、')); }
    const d = new Date();
    const dateStr = `${y}年${d.getMonth()+1}月${d.getDate()}日`;
    const pad = '　'.repeat(Math.max(2, 24 - '费县第二中学信息素养小组、摄影社'.length));
    const text = [
      '　'.repeat(Math.max(2, Math.floor((34 - form.title.length)/2))) + form.title,
      '　'.repeat(Math.max(2, Math.floor((34 - no.length)/2))) + no,
      '',
      form.to + '：',
      ...bodyText.split('\n').map(l=>'　　'+l),
      '',
      '　'.repeat(22) + '费县第二中学信息素养小组、摄影社',
      '　'.repeat(28) + dateStr
    ].join('\n');
    const folder = cfg.folders.find(f=>f.id===form.folderId);
    const entry = {
      id:U.uid(), folderId:form.folderId, name:form.title + '.txt', ts:Date.now(),
      uploaderId:operator.id, uploader:operator.displayName, size:enc.encode(text).length,
      kind:'doc', batchNo:no, desc:'自动生成文书：'+batchKinds()[form.kind],
      tags:['文书', form.kind], level:form.level||'核心级', history:[], downloads:0, deleted:false,
      contentText: bodyText.slice(0, 5000)
    };
    const buf = enc.encode(text).buffer;
    const policy = PERM.policyOf(entry.level, folder);
    const cbuf = await CPABE.encrypt(buf, policy);
    entry.encrypted = true; entry.policy = policy;
    entry.disk = await YST.upload(folder.bh, entry.name + '.cpabe', cbuf, null, nextJsq(folder.bh));
    entry.xzpz = folder.xzpz || entry.xzpz;       // 先用目录已知值兑底，避免阻塞
    await putEntry(entry);
    await update('config', C => { C.batch = cfg.batch; });
    syncFolderXzpz(folder, entry).catch(()=>{});   // 后台刷新 xzpz（不阻塞归档返回）
    await log(operator, '生成文书', no, form.title, '已归档');
    if(form.record){ await log(operator, '行为记录', no, (accounts.join('、')||'') + ' ' + form.title, '已记录'); }
    for(const id of (form.aboutIds||[])) await notify({kind:'user', v:id}, '新文书：'+form.title, `批号 ${no}，请查收。`, operator.displayName);
    return {entry, text, no};
  }
  // 同步目录的 xzpz（wjdq 获取）到条目 —— 后台执行，不阻塞上传关键路径
  async function syncFolderXzpz(folder, entry){
    try {
      const {ml} = await YST.wjdq(folder.bh);
      folder.xzpz = ml.xzpz; entry.xzpz = ml.xzpz;
      await update('config', C => { const f = C.folders.find(x=>x.id===folder.id); if(f) f.xzpz = ml.xzpz; });
      if(entry && entry.id) await update('meta', M2 => { const t = M2.items.find(x=>x.id===entry.id); if(t) t.xzpz = ml.xzpz; }).catch(()=>{});
    } catch(e){ entry.xzpz = entry.xzpz || folder.xzpz; }
  }

  /* ---------- 文档上传/下载/修改 ---------- */
  async function uploadDoc(u, folder, form, onPct){
    if(!ORG.canSetLevel(u, form.level)) throw new Error('密级超出你的权限等级：归档文件只能设置自己权限等级及以下的密级');
    const entry = {
      id:U.uid(), folderId:folder.id, name:form.name, ts:Date.now(),
      uploaderId:u.id, uploader:u.displayName, size:form.buf.byteLength,
      kind:form.kind||'file', batchNo:form.batchNo||'', desc:form.desc||'', tags:form.tags||[],
      level:form.level, history:[], downloads:0, deleted:false
    };
    if(form.encrypt){
      const policy = PERM.policyOf(form.level, folder);
      const cbuf = await CPABE.encrypt(form.buf, policy);
      entry.encrypted = true; entry.policy = policy;
      entry.disk = await YST.upload(folder.bh, form.name + '.cpabe', cbuf, onPct, nextJsq(folder.bh));
    } else {
      entry.encrypted = false;
      entry.disk = await YST.upload(folder.bh, form.name, form.buf, onPct, nextJsq(folder.bh));
    }
    entry.xzpz = folder.xzpz || entry.xzpz;        // 兑底，避免预览/下载前等待额外往返
    await putEntry(entry);
    syncFolderXzpz(folder, entry).catch(()=>{});    // 后台同步，不阻塞归档返回
    await log(u, '上传归档', form.name, '密级:'+form.level+(entry.encrypted?'(CP-ABE加密)':'(明文)'), '成功');
    if(form.batchKind) await update('config', C => { C.batch = cfg.batch; });  // 批号计数器持久化
    return entry;
  }
  async function modifyDoc(u, entry, newForm, onPct){
    const folder = cfg.folders.find(f=>f.id===entry.folderId);
    const nl = newForm.level||entry.level;
    if(nl !== entry.level && !ORG.canSetLevel(u, nl)) throw new Error('密级超出你的权限等级：归档文件只能设置自己权限等级及以下的密级');
    entry.history = entry.history || [];
    entry.history.unshift({name:entry.name, ts:entry.ts, disk:entry.disk, xzpz:entry.xzpz, by:u.displayName, note:newForm.note||'版本更新'});
    entry.name = newForm.name; entry.desc = newForm.desc||entry.desc; entry.tags = newForm.tags||entry.tags;
    entry.level = newForm.level||entry.level; entry.ts = Date.now();
    entry.size = newForm.buf.byteLength;
    if(newForm.encrypt){
      const policy = PERM.policyOf(entry.level, folder);
      const cbuf = await CPABE.encrypt(newForm.buf, policy);
      entry.encrypted = true; entry.policy = policy;
      entry.disk = await YST.upload(folder.bh, entry.name + '.cpabe', cbuf, onPct, nextJsq(folder.bh));
    } else {
      entry.encrypted = false;
      entry.disk = await YST.upload(folder.bh, entry.name, newForm.buf, onPct, nextJsq(folder.bh));
    }
    entry.xzpz = folder.xzpz || entry.xzpz;
    await putEntry(entry);
    syncFolderXzpz(folder, entry).catch(()=>{});
    await log(u, '修改文档', entry.name, '新增版本', '成功');
    return entry;
  }
  async function fetchRaw(e){
    // xzpz 优先取运行时目录值
    let xzpz = e.xzpz;
    if(!xzpz){ const folder = cfg.folders.find(f=>f.id===e.folderId); xzpz = folder && folder.xzpz; }
    const url = YST.dlUrl(e.disk, xzpz || (cfg.folders.find(f=>f.id===e.folderId)||{}).xzpz);
    const r = await fetch(url, {cache:'no-store'});
    if(!r.ok) throw new Error('文件读取失败 ' + r.status);
    return r.arrayBuffer();
  }
  async function fetchEntry(e){
    return fetchRaw(e);
  }
  // 在线查阅：取回（加密则解密）→ 返回明文；计数与日志后台执行（不阻塞预览渲染，性能优化）
  async function previewEntry(u, e){
    const buf = await fetchEntry(e);
    let plain = buf, note = '在线查阅';
    if(e.encrypted){
      const myAttrs = [...new Set([...(u.attrs||[]), '社员'])];
      for(const g of activeGrants(u)){
        const folder = cfg.folders.find(f=>f.id===g.folderId);
        if(folder) myAttrs.push(...PERM.policyOf('部门级', folder));
      }
      plain = await CPABE.decrypt(buf, myAttrs);
      note = '在线查阅(CP-ABE解密)';
    }
    update('meta', M2 => { const t=M2.items.find(x=>x.id===e.id); if(t) t.previews=(t.previews||0)+1; }).catch(()=>{});
    log(u, '在线查阅', e.name, note, '成功').catch(()=>{});
    return plain;
  }
  async function downloadEntry(u, e){
    const buf = await fetchEntry(e);
    let blob, note = '';
    if(e.encrypted){
      const u0 = Session.user();
      const myAttrs = [...new Set([...(u0.attrs||[]), '社员'])];
      for(const g of activeGrants(u0)){
        const folder = cfg.folders.find(f=>f.id===g.folderId);
        if(folder) myAttrs.push(...PERM.policyOf('部门级', folder));
      }
      const plain = await CPABE.decrypt(buf, myAttrs);
      blob = new Blob([plain]); note = 'CP-ABE解密成功';
    } else blob = new Blob([buf]);
    update('meta', M2 => { const t=M2.items.find(x=>x.id===e.id); if(t) t.downloads=(t.downloads||0)+1; }).catch(()=>{});
    log(u, '下载文档', e.name, note||'明文下载', '成功').catch(()=>{});
    U.dl(e.name, blob);
  }

  return {get cfg(){return cfg;}, get users(){return users;}, get meta(){return meta;},
    get logs(){return logs;}, get notices(){return notices;}, get requests(){return requests;},
    get points(){return points;}, get webTemp(){return WT;},
    init, loadAll, loadAllFallback, isDegraded, upd, log, notify, myNotices, unreadCount, markRead,
    submitAccessRequest, decideAccess, activeGrants, pendingAccessFor,
    submitVideo, videoCanApprove, decideVideo, videoPendingFor, VCHAIN,
    addPoints, balanceOf, board,
    createAccount, deleteAccount, updateProfile, changePwd, setAttrs,
    resetPassword, setAccountStatus, adminUpdateUser, sendNotice,
    vaultEnabled, vaultInit, vaultAdd, vaultOpen,
    entryById, entriesIn, allEntries, putEntry, softDeleteEntry,
    deletedEntries, restoreEntry, purgeEntry, probeEntries, healthCheck, forceWriteAll,
    flushDirty, dirtyNames, startFlushTimer,
    nextBatchNo, peekBatchNo, batchKinds, genDoc,
    uploadDoc, modifyDoc, fetchEntry, fetchRaw, downloadEntry, previewEntry,
    backupAll, restoreBackup, snapshot, maybeAutoBackup, listAutoBackups, restoreAuto, canAutoBackup,
    LS};
})();

/* ---------- Modal 组件 ---------- */
const Modal = (() => {
  function open(html, opt={}){
    const mask = mk('div'); mask.className='mask';
    mask.innerHTML = `<div class="modal ${opt.lg?'lg':''}">${html}</div>`;
    mask.addEventListener('click', e=>{ if(e.target===mask && !opt.sticky) mask.remove(); });
    APPROOT().appendChild(mask);
    return mask;
  }
  function confirm(title, body, okText){
    return new Promise(res => {
      const m = open(`<h3>${U.esc(title)}</h3><div class="muted" style="line-height:1.8">${body}</div>
        <div class="foot"><button class="btn" id="mc">取消</button><button class="btn pri" id="mo">${okText||'确认'}</button></div>`, {sticky:true});
      m.querySelector('#mc').onclick = ()=>{ m.remove(); res(false); };
      m.querySelector('#mo').onclick = ()=>{ m.remove(); res(true); };
    });
  }
  function closeAll(){ $$('.mask').forEach(m=>m.remove()); }
  return {open, confirm, closeAll};
})();

/* ---------- 文档可见性判定 ----------
 * 可见性模型：
 * · 元数据（标题/批号/密级/上传人/时间）对所有登录用户可见 —— canSeeMeta 恒真；
 * · 公开级文件全员可在线查看与下载 —— canReadEntry 对公开级直接放行；
 * · 其余文件需目录可见且（加密时）持有满足密级策略的属性，才可在线查看/下载。 */
function folderById(id){ return (Store.cfg.folders||[]).find(f=>f.id===id); }
function canSeeMeta(u, e){ return true; }
function canViewEntry(u, e){
  const f = folderById(e.folderId); if(!f) return false;
  const grants = Store.activeGrants(u).filter(g=>!g.folderId||g.folderId===f.id);
  return PERM.canViewF(f, u, Store.cfg.folders, grants);
}
/* 内容可读判定：公开级全员可读；其余需目录可见且（加密时）属性满足密级策略 → 才显示「在线查看/下载」 */
function canReadEntry(u, e){
  if(e.level === '公开级') return true;
  if(!canViewEntry(u, e)) return false;
  if(!e.encrypted) return true;
  const f = folderById(e.folderId);
  const policy = e.policy || PERM.policyOf(e.level, f);
  const attrs = new Set([...(u.attrs||[]), '社员']);
  for(const g of Store.activeGrants(u)){
    const gf = folderById(g.folderId);
    if(gf) PERM.policyOf('部门级', gf).forEach(a=>attrs.add(a));
  }
  return policy.some(a => attrs.has(a));
}

const SEARCH_MODES = [['all','综合'],['title','题目'],['batch','批号'],['content','内容'],['tag','标签'],['uploader','上传人']];
function semesterStart(){
  const d = new Date(); const y = d.getFullYear(); const m = d.getMonth()+1;
  if(m >= 8) return new Date(y, 7, 15).getTime();
  if(m <= 1) return new Date(y-1, 7, 15).getTime();
  return new Date(y, 1, 15).getTime();
}
function filterEntries(list, p){
  const q = (p.q||'').trim().toLowerCase();
  const from = p.from ? new Date(p.from + 'T00:00:00').getTime() : null;
  const to = p.to ? new Date(p.to + 'T23:59:59').getTime() : null;
  return list.filter(e=>{
    if(from && !(e.ts >= from)) return false;
    if(to && !(e.ts <= to)) return false;
    if(!q) return true;
    const mode = p.mode || 'all';
    if(mode==='title') return (e.name||'').toLowerCase().includes(q);
    if(mode==='batch') return (e.batchNo||'').toLowerCase().includes(q);
    if(mode==='content') return ((e.contentText||'') + ' ' + (e.desc||'')).toLowerCase().includes(q);
    if(mode==='tag') return (e.tags||[]).some(t=>String(t).toLowerCase().includes(q));
    if(mode==='uploader') return (e.uploader||'').toLowerCase().includes(q);
    return ((e.name||'')+' '+(e.batchNo||'')+' '+(e.desc||'')+' '+(e.tags||[]).join(' ')+' '+(e.uploader||'')+' '+(e.contentText||'')).toLowerCase().includes(q);
  });
}

function bindSearchPanel(idp, u, onRes){
  const get = () => ({q:$('#'+idp+'_q').value, mode:$('#'+idp+'_mode').value,

Router.reg('docs', async (main, folderId) => {

  const visible = folders.filter(f => PERM.canViewF(f, u, folders, grants));
  const curId = folderId || 'F0';

  const cur = isAll ? null : folders.find(f=>f.id===curId);
  // 目录树（顶部附「全部文档」元数据总览虚拟节点）
  const children = pid => visible.filter(f=>f.parent===pid);
  let tree = '';
  function node(f, depth){
    const kids = children(f.id);
    const hasKids = kids.length>0;
    tree += `<div class="tnode ${f.id===curId?'on':''}" data-f="${f.id}" style="padding-left:${8+depth*14}px">

      <span class="ar"></span><span>📋 全部文档（标题/批号）</span></div>` + tree;

/* ---------- 在线查看 ---------- */
async function previewDlg(id){
  const e = Store.entryById(id); if(!e) return;
  const u = Session.user();
  if(!canReadEntry(u,e)){ U.toast('无权限查看该文档（公开级文件全员可查阅，其余需相应权限）',1); return; }
  const kind = U.fileKind(e.name);
  const kindLabel = {text:'纯文本', image:'图片', pdf:'PDF 文档', docx:'Word 文档（提取正文）', other:'该格式暂不支持预览，请下载查看'}[kind];
  const m = Modal.open(`<h3>在线查看 · ${U.esc(e.name)}</h3>
    <div class="muted" style="margin-bottom:8px">${e.encrypted?'CP-ABE 解密后预览 · ':''}${kindLabel}${e.batchNo?` · 批号 ${U.esc(e.batchNo)}`:''}</div>
    <div id="pv_body" style="min-height:120px"><div class="empty">正在取回${e.encrypted?'并解密':''}…</div></div>
    <div class="foot"><button class="btn" id="pv_c">关闭</button><button class="btn pri" id="pv_d">下载原文件</button></div>`, {lg:true, sticky:true});
  m.querySelector('#pv_c').onclick=()=>m.remove();
  m.querySelector('#pv_d').onclick=()=>{ m.remove(); dlEntry(id); };
  try {
    const buf = await Store.previewEntry(u, e);
    const body = m.querySelector('#pv_body');
    if(!body) return;
    if(kind === 'text'){
      body.innerHTML = `<div class="docview" style="max-height:56vh;overflow-y:auto">${U.esc(new TextDecoder('utf-8').decode(buf))}</div>`;
    } else if(kind === 'image'){
      const url = URL.createObjectURL(new Blob([buf]));
      setTimeout(()=>URL.revokeObjectURL(url), 600000);
      body.innerHTML = `<div style="text-align:center;background:rgba(127,127,127,.08);border-radius:8px;padding:10px"><img src="${url}" style="max-width:100%;max-height:56vh" alt="预览"></div>`;
    } else if(kind === 'pdf'){
      const url = URL.createObjectURL(new Blob([buf], {type:'application/pdf'}));
      setTimeout(()=>URL.revokeObjectURL(url), 600000);
      body.innerHTML = `<iframe src="${url}" style="width:100%;height:56vh;border:0;border-radius:8px;background:#f6f7f9" title="PDF 预览"></iframe>`;
    } else if(kind === 'docx'){
      let text = '';
      try { text = await DOCX.extractText(buf); }
      catch(err){ body.innerHTML = `<div class="empty">正文提取失败：${U.esc(err.message||err)}<br>请下载原文件查看</div>`; return; }
      body.innerHTML = `<div class="docview" style="max-height:56vh;overflow-y:auto">${U.esc(text||'（未提取到文本内容）')}</div>`;
    } else {
      body.innerHTML = `<div class="empty">该格式暂不支持在线预览，请下载原文件查看</div>`;
    }
  } catch(err){
    const body = m.querySelector('#pv_body');
    if(body) body.innerHTML = `<div class="empty">预览失败：${U.esc(err.message||err)}</div>`;
    if(e.encrypted) U.toast('提示：需持有满足密级策略的属性密钥',1);
  }
}

    btn.disabled = false;
  };
  // 自动备份
  $('#ab_now').onclick = async () => {
    const btn = $('#ab_now'); btn.disabled = true;
    try {
      const r = await Store.maybeAutoBackup(Session.user(), true);
      if(r.ok){ U.toast('自动备份已生成：'+r.name); renderShell(); Router.go('backup'); }
      else U.toast('未执行：'+(r.reason||''),1);
    } catch(e){ U.toast('自动备份失败：'+(e.message||e),1); }
    btn.disabled = false;
  };
  (async () => {
    try {
      const list = await Store.listAutoBackups();
      const el = $('#ab_list'); if(!el) return;
      if(!list.length){ el.innerHTML = '网盘中暂无自动备份文件'; return; }
      el.innerHTML = list.map((b,i)=>`<div class="kv"><span class="k">${U.esc(b.name)}（${U.fmtSize(b.size)}）</span>
        <span><button class="btn sm" data-ab="${i}">恢复此备份</button></span></div>`).join('');
      list.forEach((b,i)=>{
        const btn = el.querySelector(`[data-ab="${i}"]`);
        if(btn) btn.onclick = async () => {
          if(!await Modal.confirm('恢复自动备份', `确定用「${U.esc(b.name)}」覆盖当前全部数据？`, '确认恢复')) return;
          btn.disabled = true;
          try {
            const rep = await Store.restoreAuto(b, (p,s)=>{ el.textContent = s||('恢复中 '+p+'%'); });
            U.toast(`恢复完成：数据 ${rep.data} 份，文档 ${rep.docs} 份`);
            renderShell(); Router.go('home');
          } catch(e){ U.toast('恢复失败：'+(e.message||e),1); btn.disabled=false; }
        };
      });
    } catch(e){ const el = $('#ab_list'); if(el) el.textContent = '自动备份列表加载失败：'+(e.message||e); }
  })();
});

function deptText(u){
  const d = ORG.deptOf(u); if(d) return d.club+'·'+d.dept+'·'+d.role;
  if((u.attrs||[]).includes('社长')) return '社长';
  if((u.attrs||[]).includes('副社长-摄影社')) return '摄影社·副社长';
  if((u.attrs||[]).includes('副社长-信息素养小组')) return '信息素养小组·副社长';
  if((u.attrs||[]).some(a=>a.startsWith('秘书处-'))) return (u.attrs||[]).find(a=>a.startsWith('秘书处-'));
  return '社员';
}

/* 仅更新顶栏通知角标（性能：代替 renderShell 全量重建） */
function refreshBadge(){
  const u = Session.user(); if(!u) return;
  const n = Store.unreadCount(u);
  $$('.menu a[data-r="notices"]').forEach(a=>{
    const ex = a.querySelector('.badge');
    if(n > 0){ if(ex){ ex.textContent = n; } else { const b = mk('span'); b.className='badge'; b.textContent=n; a.appendChild(b); } }
    else if(ex) ex.remove();
  });
}
function videoCard(v, u){
  const st = v.steps.map((s,i)=>{
    const cls = s.status==='已通过'?'done':s.status==='已驳回'?'rej':(i===v.step&&v.status==='审批中'?'cur':'');
    return `<div class="step ${cls}"><div class="dot">${s.status==='已通过'?'✓':s.status==='已驳回'?'✕':i+1}</div>${s.label}${s.by?'·'+U.esc(s.by):''}</div>${i<v.steps.length-1?'<span class="muted">—</span>':''}`;
  }).join('');
  const can = Store.videoCanApprove(v, u);
  return `<div class="nitem"><div class="nt">🎬 视频申请文书 · ${U.esc(v.title)}</div>
    <div class="nb">申请人：${U.esc(v.applicant)}　简介：${U.esc(v.brief||'-')}</div>
    <div class="nb" style="color:var(--txt3)">文书内容：${U.esc((v.content||'').slice(0,120))}${(v.content||'').length>120?'…':''}</div>
    <div class="steps">${st}</div>
    ${can?`<div class="nm2"><span>${U.esc(can.label)} 环节审批</span>
      <button class="btn sm pri" data-vok="${v.id}">通过</button>
      <button class="btn sm danger" data-vno="${v.id}">驳回</button></div>`:''}
    <div class="nm2"><span>${U.fmtTs(v.ts)}</span><span class="tag ${v.status==='已通过'?'green':v.status==='已驳回'?'red':'orange'}">${v.status}</span></div>
  </div>`;
}
function bindVideoBtns(u){
  $$('[data-vok]').forEach(b=>b.onclick=async()=>{
    const c = prompt('审批备注（可空）：')||'';
    await Store.decideVideo(u, b.dataset.vok, true, c); U.toast('已通过'); Router.go('notices'); });
  $$('[data-vno]').forEach(b=>b.onclick=async()=>{
    const c = prompt('驳回理由：')||'';
    await Store.decideVideo(u, b.dataset.vno, false, c); U.toast('已驳回'); Router.go('notices'); });
}

/* --- 行为日志（增强：操作人/结果筛选 + CSV 导出） --- */
function adminLog(el){
  const logs = (Store.logs.items||[]).slice().sort((a,b)=>b.ts-a.ts);
  const usersList = [...new Set(logs.map(l=>l.name).filter(Boolean))];
  el.innerHTML = `
  <div class="card">
    <h3>全社行为日志（${logs.length} 条） <span class="muted" style="font-weight:400;font-size:12px;margin-left:auto">最近 900 条滚动保留</span></h3>
    <div class="row wrap" style="margin-bottom:10px">
      <input id="lg_q" placeholder="按账号/行为/对象筛选…" style="max-width:260px">
      <select id="lg_u" style="max-width:130px"><option value="">全部人员</option>
        ${usersList.map(n=>`<option>${U.esc(n)}</option>`).join('')}</select>
      <select id="lg_r" style="max-width:120px"><option value="">全部结果</option><option>成功</option><option>失败</option><option>待审批</option></select>
      <button class="btn sm" id="lg_csv">⬇ 导出 CSV</button>
    </div>
    <div id="lg_list" style="max-height:60vh;overflow-y:auto"></div>
  </div>`;
  const render = () => {
    const q = ($('#lg_q').value||'').trim();
    const un = $('#lg_u').value;
    const rr = $('#lg_r').value;
    const list = logs.filter(l => (!q || (l.user+l.name+l.action+l.target+l.detail).includes(q)) &&
      (!un || l.name===un) && (!rr || l.result===rr));
    $('#lg_list').innerHTML = list.map(l=>`
      <div class="logline">[${U.fmtTs(l.ts)}] <b>${U.esc(l.name)}</b>（${U.esc(l.user)}）
        ${U.esc(l.action)} · <b>${U.esc(l.target)}</b> ${U.esc(l.detail)}
        <span class="${l.result==='成功'||l.result==='已记录'?'ok':l.result==='失败'?'no':'muted'}">${U.esc(l.result)}</span></div>`).join('')
      || '<div class="empty">无匹配记录</div>';
  };
  $('#lg_q').oninput = U.debounce(render, 250);
  $('#lg_u').onchange = render;
  $('#lg_r').onchange = render;
  $('#lg_csv').onclick = () => {
    const rows = [['时间','账号','姓名','行为','对象','详情','结果']];
    for(const l of logs) rows.push([U.fmtTs(l.ts), l.user, l.name, l.action, l.target, l.detail, l.result]);
    const csv = '\ufeff' + rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const d = new Date(); const p=n=>String(n).padStart(2,'0');
    U.dl(`行为日志_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.csv`, new Blob([csv], {type:'text/csv;charset=utf-8'}));
    U.toast('日志已导出');
  };
  render();
}

/* ---------- 密码保险库（社长专属 · FZENC AES-256 加密存储） ---------- */
function vaultStoreDlg(username, displayName, pwd, note){
  return new Promise((res, rej) => {
    if(!Store.vaultEnabled()){ rej(new Error('请先在密码保险库中初始化')); return; }
    const m = Modal.open(`<h3>存入密码保险库 → ${U.esc(username)}</h3>
      <div class="muted" style="line-height:1.8">输入保险库密码，将「${U.esc(displayName)}（${U.esc(username)}）」的当前密码加密存档。</div>
      <label class="fl">保险库密码</label><input id="vs_p" type="password">
      <div class="foot"><button class="btn" id="vs_c">取消</button><button class="btn pri" id="vs_o">存入</button></div>`, {sticky:true});
    m.querySelector('#vs_c').onclick=()=>{ m.remove(); rej(new Error('已取消')); };
    m.querySelector('#vs_o').onclick = async () => {
      try {
        await Store.vaultAdd(Session.user(), m.querySelector('#vs_p').value, {username, displayName, pwd, note:note||'', ts:Date.now()});
        U.toast('已存入密码保险库'); m.remove(); res();
      } catch(e){ m.querySelector('#vs_o').disabled = false; rej(e); }
    };
  });
}

        try {

            {username:m2.querySelector('#va_u').value, displayName:m2.querySelector('#va_u').selectedOptions[0].dataset.n,
             pwd:m2.querySelector('#va_p').value, note:m2.querySelector('#va_n').value.trim(), ts:Date.now()});
          U.toast('已存入'); m2.remove();
          const list = await Store.vaultOpen(Session.user(), m.querySelector('#vb_p').value);
          renderList(list);
        } catch(e){ U.toast('存入失败：'+(e.message||e),1); }
      };
    };
  } else {
    m.querySelector('#vb_i').onclick = async () => {
      const p1 = m.querySelector('#vb_p1').value, p2 = m.querySelector('#vb_p2').value;
      if(p1 !== p2){ U.toast('两次密码不一致',1); return; }
      try {
        await Store.vaultInit(Session.user(), p1);
        U.toast('保险库已初始化'); m.remove(); vaultDlg();
      } catch(e){ m.querySelector('#vb_s').textContent = e.message||String(e); }
    };
  }
}

}

  };
}

/* ---------- 启动（并行加载 + 智能续期 + 令牌池冗余 + 保活 + 降级模式） ---------- */
let booted = false;
/* 令牌池回存：新令牌写入 config.sysToken 并滑窗保留 8 个历史（续期韧性） */
let _rememberT = null;
function rememberTokens(){
  const t = YST.tk; if(!t) return;
  clearTimeout(_rememberT);
  _rememberT = setTimeout(() => {
    Store.upd('config', C => {
      if(C.sysToken !== t){
        C.sysToken = t; C.sysTokenTs = Date.now();
        C.sysTokens = [t, ...(C.sysTokens||[])].filter((x,i,a)=>a.indexOf(x)===i).slice(0, 8);
      }
    }).catch(()=>{});
  }, 400);
}
/* 令牌保活：页面打开期间每 12 小时强制续期一次，保持链条常新 */
function startTokenKeepalive(){
  if(window.__kaTimer) return;
  window.__kaTimer = setInterval(() => {
    if(!Session.user()) return;
    YST.boot(true).then(()=>rememberTokens()).catch(()=>{});
  }, 12*3600*1000);
}
/* 认证致命失败：自动弹出令牌修复中心（10 分钟节流在 YST 内部） */
YST.onAuthFail(() => {
  U.toast('网盘连接异常：已打开令牌修复中心', 1);
  Modal.closeAll();
  showRecoveryDlg();
});
/* ---------- 引擎自愈信号 + 版本自检（更新必达机制） ----------
 * 1) SVG 宿主（网盘引擎）启动时把自身 URL 写入 config.engineUrl ——
 *    config 里永远是「最近一次有人打开系统所用的引擎地址」，启动器据此自动追新；
 * 2) config.appVer 高于本内置版本时，顶部黄条提示「打开最新版」一键跳转 ——
 *    旧部署包 iframe 加载到旧引擎时，用户也能被引导到最新入口。 */
function syncEngineSignal(){
  try{
    const C = Store.cfg || {};
    const onYsepan = /ysepan\.com/i.test(location.href);
    const isSvgHost = IS_SVG_DOC && onYsepan && /\.svg(\?|$)/i.test(location.pathname + location.search);
    if(isSvgHost && location.href !== C.engineUrl){
      Store.upd('config', X => { X.engineUrl = location.href; X.engineTs = Date.now(); }).catch(()=>{});
    }
    const num = s => { const m = /^v(\d+)/.exec(String(s || '')); return m ? +m[1] : 0; };
    if(C.appVer && num(C.appVer) > num(APP_VER)) showUpgradeBar(C);
  }catch(e){}
}
function showUpgradeBar(C){
  if(APPROOT().querySelector('#upg_bar')) return;
  const bar = mk('div');
  bar.id = 'upg_bar'; bar.className = 'dbar';
  bar.style.cssText = 'position:relative;z-index:9998;padding:9px 16px;font-size:13px';
  const url = C.engineUrl || '';
  bar.innerHTML = '<span>⬆ 系统已升级至 ' + U.esc(C.appVer) + '，当前打开的是旧版入口</span>'
    + (url ? '　<a href="' + U.esc(url) + '" target="_blank" rel="noopener" style="color:#1589e9;font-weight:600;text-decoration:underline">打开最新版↗</a>' : '')
    + '　<span id="upg_x" style="cursor:pointer;opacity:.7">✕</span>';
  APPROOT().insertBefore(bar, APPROOT().firstChild);
  const x = bar.querySelector('#upg_x');
  if(x) x.onclick = () => bar.remove();
}
async function bootApp(skipBoot){
  Theme.init();
  try {
    if(!Store.cfg){
      Store.init(window.WEBTEMP_BH);
      // 一次 wjdq → 并行读取全部数据文件（网盘最新版 → 本机快照 → 默认结构 三级兜底）
      await Store.loadAll();
      // 令牌冗余池注入（config.sysToken + config.sysTokens 历史池）
      (Store.cfg.sysTokens||[]).forEach(t=>YST.addExtra(t));
      if(Store.cfg.sysToken) YST.addExtra(Store.cfg.sysToken);
      // 智能续期：令牌仍有效超 24h 则跳过；后台执行不阻塞启动，成功后回写 config 续期链
      YST.boot().then(() => rememberTokens()).catch(()=>{});
      Store.startFlushTimer();       // 数据不丢失：脏文件周期/卸载冲刷
      startTokenKeepalive();         // 令牌保活
    }
    const restored = await Session.restore();
    if(!restored){ viewLogin(); return; }
    renderShell();
    syncEngineSignal();              // 更新必达：引擎自愈信号 + 版本自检（登录后插入，避免被登录页重写）
    const path = (location.hash||'').replace(/^#\//,'') || 'home';
    const seg = path.split('/');
    Router.go(seg[0], ...seg.slice(1));
    // 静默周期备份（仅社长/处长；距上次超 7 天才真正执行）
    Store.maybeAutoBackup(Session.user()).catch(()=>{});
  } catch(e){
    // 降级模式：网盘全断（令牌链条失效/网络故障）时用本机快照启动，可登录浏览与操作，
    // 操作数据保留在本机快照，令牌恢复后自动冲刷回网盘 —— 确保数据不丢失
    try {
      if(!Store.cfg){
        Store.init(window.WEBTEMP_BH);
        Store.loadAllFallback();
        (Store.cfg.sysTokens||[]).forEach(t=>YST.addExtra(t));
        if(Store.cfg.sysToken) YST.addExtra(Store.cfg.sysToken);
        Store.startFlushTimer();
        window.__DEGRADED = true;
      }
      const restored = await Session.restore();
      if(restored){
        renderShell();
        syncEngineSignal();
        const path = (location.hash||'').replace(/^#\//,'') || 'home';
        const seg = path.split('/');
        Router.go(seg[0], ...seg.slice(1));
        U.toast('网盘连接异常：已进入离线模式，可打开「令牌修复中心」恢复', 1);
        showRecoveryDlg();
        return;
      }
      viewLogin();   // 本机快照可用：进入登录页（含离线提示），社长登录后可修复令牌
      setTimeout(showRecoveryDlg, 600);
      return;
    } catch(e2){}
    $('#app').innerHTML = `<div class="login-wrap"><div class="login-hero">
      <div class="bgimg"></div><div class="bmask"></div>
      <div class="login-box" style="position:relative;z-index:1">
      <h1>系统初始化失败</h1>
      <div class="muted" style="margin:14px 0;line-height:1.9">${U.esc(e.message||e)}</div>
      <button class="btn pri" style="width:100%;justify-content:center;margin-bottom:10px" onclick="location.reload()">重试</button>
      <button class="btn" style="width:100%;justify-content:center" id="boot_rc">令牌修复中心</button>
    </div></div></div>`;
    const brc = $('#boot_rc');
    if(brc) brc.onclick = showRecoveryDlg;
  }
}
window.addEventListener('hashchange', () => {
  if(!Session.user()) return;
  const path = (location.hash||'').replace(/^#\//,'') || 'home';
  const seg = path.split('/');
  Router.go(seg[0], ...seg.slice(1));
});
__LAUNCH();

</script>
